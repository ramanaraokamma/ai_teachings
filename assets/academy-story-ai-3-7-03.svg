<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="622" viewBox="0 0 1200 622" role="img" aria-labelledby="title desc"><title id="title">Controlled prompt experiments — evidence trace</title><desc id="desc">Controlled prompt experiments — evidence trace. On six development cases P passes cases 1, 2, 3, 4; Q passes 1, 2, 3, 5, 6. Missing-approval cases are 4 and 6. Compare totals and condition results. | Evaluate both prompts on paired cases with fixed model/version, source records, output contract and scoring rubric. | P passes 4/6 and Q 5/6. P passes one of two missing-approval cases, Q also one of two.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="622" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/7 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Controlled prompt experiments — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">On six development cases P</tspan><tspan x="52.0" dy="32.66">passes cases 1, 2, 3, 4; Q</tspan><tspan x="52.0" dy="32.66">passes 1, 2, 3, 5, 6.</tspan><tspan x="52.0" dy="32.66">Missing-approval cases are 4</tspan><tspan x="52.0" dy="32.66">and 6. Compare totals and</tspan><tspan x="52.0" dy="32.66">condition results.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Evaluate both prompts on</tspan><tspan x="426.6666666666667" dy="32.66">paired cases with fixed</tspan><tspan x="426.6666666666667" dy="32.66">model/version, source records,</tspan><tspan x="426.6666666666667" dy="32.66">output contract and scoring</tspan><tspan x="426.6666666666667" dy="32.66">rubric.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">P passes 4/6 and Q 5/6. P</tspan><tspan x="801.3333333333334" dy="32.66">passes one of two</tspan><tspan x="801.3333333333334" dy="32.66">missing-approval cases, Q</tspan><tspan x="801.3333333333334" dy="32.66">also one of two.</tspan></text><text x="50" y="494" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>