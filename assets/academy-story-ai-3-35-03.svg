<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Capstone evaluation and revision — evidence trace</title><desc id="desc">Capstone evaluation and revision — evidence trace. On ten final cases baseline passes seven and assistant eight. One assistant failure exposes a teacher-only source to a student. | Report paired case outcomes, condition rates and permission violations separately. A critical access failure can block release even when overall pass rate rises. Never overwrite the original final run. | Rates 70% and 80%, gain 10 percentage points. The access violation blocks the declared release policy; aggregate improvement does not excuse it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/35 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Capstone evaluation and revision — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">On ten final cases baseline</tspan><tspan x="52.0" dy="32.66">passes seven and assistant</tspan><tspan x="52.0" dy="32.66">eight. One assistant failure</tspan><tspan x="52.0" dy="32.66">exposes a teacher-only source</tspan><tspan x="52.0" dy="32.66">to a student.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Report paired case outcomes,</tspan><tspan x="426.6666666666667" dy="32.66">condition rates and permission</tspan><tspan x="426.6666666666667" dy="32.66">violations separately. A critical</tspan><tspan x="426.6666666666667" dy="32.66">access failure can block</tspan><tspan x="426.6666666666667" dy="32.66">release even when overall</tspan><tspan x="426.6666666666667" dy="32.66">pass rate rises. Never</tspan><tspan x="426.6666666666667" dy="32.66">overwrite the original final run.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Rates 70% and 80%, gain 10</tspan><tspan x="801.3333333333334" dy="32.66">percentage points. The access</tspan><tspan x="801.3333333333334" dy="32.66">violation blocks the declared</tspan><tspan x="801.3333333333334" dy="32.66">release policy; aggregate</tspan><tspan x="801.3333333333334" dy="32.66">improvement does not excuse</tspan><tspan x="801.3333333333334" dy="32.66">it.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>