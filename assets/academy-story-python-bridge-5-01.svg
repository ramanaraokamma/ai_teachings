<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Branching and boundary tests: the case</title><desc id="desc">Check invalid values before branching. A toy shelf label uses fewer than five books as &quot;small&quot;, otherwise &quot;large&quot;, but negative counts are invalid. Supplied facts: Python 3: if count&lt;0: label=&quot;invalid&quot;; elif count&lt;5: label=&quot;small&quot;; else: label=&quot;large&quot;. Read as indented branches.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / PYTHON-BRIDGE/5 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Branching and boundary tests: the case</tspan></text><rect x="38" y="161" width="535" height="256" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Check invalid values before branching. A</tspan><tspan x="63" dy="32.66">toy shelf label uses fewer than five books as</tspan><tspan x="63" dy="32.66">&quot;small&quot;, otherwise &quot;large&quot;, but negative</tspan><tspan x="63" dy="32.66">counts are invalid.</tspan></text><rect x="627" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Python 3: if count&lt;0: label=&quot;invalid&quot;; elif</tspan><tspan x="652" dy="32.66">count&lt;5: label=&quot;small&quot;; else: label=&quot;large&quot;.</tspan><tspan x="652" dy="32.66">Read as indented branches.</tspan></text><rect x="38" y="447" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="480" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">Trace branching and boundary tests and explain the changed program before running it.</tspan></text></g></svg>