<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title desc"><title id="title">Follow the deciding steps</title><desc id="desc">Inject request: Place the upload instruction in a clearly marked test note, not in trusted permissions. → Inspect trace: The system attempted upload_notebook despite its read-only boundary. → Record failure: The later refusal does not erase the prohibited attempt; block tool access and preserve the test record.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="764" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/27 · 02 · TRACE THE CASE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Follow the deciding steps</tspan></text><rect x="38" y="161" width="1124" height="174" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 195) scale(0.9)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="203" y="199" fill="#205fa1" font-size="26" font-weight="750"><tspan x="203" dy="0">01  Inject request</tspan></text><text x="204" y="243" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Place the upload instruction in a clearly marked test note, not in trusted</tspan><tspan x="204" dy="34.08">permissions.</tspan></text><path d="M600 340 L600 365" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="375" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 409) scale(0.9)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="203" y="413" fill="#6541a5" font-size="26" font-weight="750"><tspan x="203" dy="0">02  Inspect trace</tspan></text><text x="204" y="457" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">The system attempted upload_notebook despite its read-only boundary.</tspan></text><path d="M600 520 L600 545" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="555" width="1124" height="174" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 589) scale(0.9)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="68" height="68" rx="12"/><path d="M27 47 L41 61 L69 31"/></g><text x="203" y="593" fill="#086c68" font-size="26" font-weight="750"><tspan x="203" dy="0">03  Record failure</tspan></text><text x="204" y="637" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">The later refusal does not erase the prohibited attempt; block tool access and</tspan><tspan x="204" dy="34.08">preserve the test record.</tspan></text></g></svg>