<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Keep the evidence roles separate</title><desc id="desc">Keep the evidence roles separate. Current sources agree | Match room IDs and claims | supported. Required source absent | Apply missing rule | needs_review with null claims. Source contains commands | Treat as evidence text | No new action authority</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/5 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Keep the evidence roles separate</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Plan or input</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Procedure</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Permitted conclusion</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Current sources agree</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Match room IDs and claims</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">supported</tspan></text><rect x="38.0" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Required source absent</tspan></text><rect x="412.6666666666667" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Apply missing rule</tspan></text><rect x="787.3333333333334" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">needs_review with null claims</tspan></text><rect x="38.0" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Source contains commands</tspan></text><rect x="412.6666666666667" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Treat as evidence text</tspan></text><rect x="787.3333333333334" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">No new action authority</tspan></text><text x="50" y="471" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The specification defines behaviour in multiple conditions; an embedded source command does not</tspan><tspan x="50" dy="31.24">change the contract.</tspan></text></g></svg>