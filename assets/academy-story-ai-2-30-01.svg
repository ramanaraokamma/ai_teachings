<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="title desc"><title id="title">Agents and Tools: the case</title><desc id="desc">A fictional read-only catalogue assistant follows a fixed state machine. Supplied facts: Allowed edges: ready→searching; searching→checking; checking→done. done has no outgoing edge. Trace A: ready→searching→checking→done. Trace B: ready→searching→done.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="654" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/30 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Agents and Tools: the case</tspan></text><rect x="38" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 10 V25 M47 25 L29 44 L47 63 L65 44 Z M29 44 H12 V79 M65 44 H82 V79"/><circle cx="12" cy="82" r="5"/><circle cx="82" cy="82" r="5"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">A fictional read-only catalogue assistant</tspan><tspan x="63" dy="32.66">follows a fixed state machine.</tspan></text><rect x="627" y="161" width="535" height="354" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Allowed edges: ready→searching;</tspan><tspan x="652" dy="32.66">searching→checking; checking→done.</tspan><tspan x="652" dy="32.66">done has no outgoing edge.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">Trace A:</tspan><tspan x="652" dy="32.66">ready→searching→checking→done. Trace</tspan><tspan x="652" dy="32.66">B: ready→searching→done.</tspan></text><rect x="38" y="545" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="578" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can validate a bounded agent’s transitions and stop after a terminal state.</tspan></text></g></svg>