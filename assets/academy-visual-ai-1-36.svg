<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1253" viewBox="0 0 1120 1253"><rect x="0" y="0" width="1120" height="1253" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-1/36</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Expo and Defense</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 Q31 12 46 21 Q64 12 82 19 V74 Q64 66 46 77 Q30 66 12 74 Z"/><path d="M46 21 V77 M21 31 L36 34 M56 33 L73 30 M21 43 L36 46 M56 45 L73 42"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Describe contract</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Show the task, inputs, rule and reserved case selection.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="158" rx="5" fill="#35699d"/><circle cx="131" cy="578.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,531.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Show results</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Prototype 8/10=80%; baseline 9/10=90% on attempted</text><text x="216" y="634.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">cases.</text><path d="M560 664.7 V684.7 M550 676.7 L560 686.7 L570 676.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="694.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="694.7" width="10" height="150" rx="5" fill="#946528"/><circle cx="131" cy="769.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,722.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="36"/><path d="M31 33 Q34 17 51 22 Q72 30 56 45 Q47 51 47 60"/><circle cx="47" cy="72" r="2"/></g><text x="216" y="737.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Keep incomplete work</text><text x="216" y="788.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Two unrun cases remain visible, without pass/fail labels.</text><path d="M560 851.7 V871.7 M550 863.7 L560 873.7 L570 863.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="881.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="881.7" width="10" height="158" rx="5" fill="#7155a0"/><circle cx="131" cy="960.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,913.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="216" y="924.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Defend conclusion</text><text x="216" y="975.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Prototype did not beat baseline on this measured</text><text x="216" y="1016.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">outcome; explain its failures.</text><rect x="52" y="1064.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1104.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1149.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Someone adds the two unrun cases to the denominator as failures.</text><text x="52" y="1205.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>