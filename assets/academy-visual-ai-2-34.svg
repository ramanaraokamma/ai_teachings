<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1245" viewBox="0 0 1120 1245"><rect x="0" y="0" width="1120" height="1245" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-2/34</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Test Diverse Users</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Total count</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Passes 4+1+2+1=8; cases 4+3+3+2=12.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="574.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,527.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Overall rate</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">8/12≈66.7% full passes.</text><path d="M560 656.7 V676.7 M550 668.7 L560 678.7 L570 668.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="686.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="686.7" width="10" height="150" rx="5" fill="#946528"/><circle cx="131" cy="761.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,714.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="729.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Find weak slices</text><text x="216" y="780.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Equality 1/3; invalid 2/3; ties 1/2; ordinary 4/4.</text><path d="M560 843.7 V863.7 M550 855.7 L560 865.7 L570 855.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="873.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="873.7" width="10" height="158" rx="5" fill="#7155a0"/><circle cx="131" cy="952.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,905.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="216" y="916.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Prioritise repair</text><text x="216" y="967.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Inspect failed equality traces and any invalid-input safety</text><text x="216" y="1008.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">consequence, not only the total.</text><rect x="52" y="1056.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1096.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1141.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Someone reports only the ordinary slice.</text><text x="52" y="1197.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>