<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1245" viewBox="0 0 1120 1245"><rect x="0" y="0" width="1120" height="1245" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-1/15</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Save New Examples for Testing</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="158" rx="5" fill="#147d87"/><circle cx="131" cy="391.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,344.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Freeze</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Write PencilP and its boundary before opening the label</text><text x="216" y="447.4" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">envelope.</text><path d="M560 477.7 V497.7 M550 489.7 L560 499.7 L570 489.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="507.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="507.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="582.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,535.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="25" r="8"/><circle cx="17" cy="70" r="8"/><circle cx="48" cy="47" r="10"/><circle cx="79" cy="25" r="8"/><circle cx="79" cy="70" r="8"/><path d="M24 30 L39 41 M24 65 L39 53 M57 41 L72 30 M57 53 L72 65"/></g><text x="216" y="550.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Predict</text><text x="216" y="601.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">For 3,5,6,9 cm predict short,short,long,long.</text><path d="M560 664.7 V684.7 M550 676.7 L560 686.7 L570 676.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="694.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="694.7" width="10" height="150" rx="5" fill="#946528"/><circle cx="131" cy="769.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,722.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="216" y="737.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Reveal references</text><text x="216" y="788.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Envelope labels are short,long,long,long.</text><path d="M560 851.7 V871.7 M550 863.7 L560 873.7 L570 863.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="881.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="881.7" width="10" height="150" rx="5" fill="#7155a0"/><circle cx="131" cy="956.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,909.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="924.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Compare</text><text x="216" y="975.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Three of four agree; the disagreement is at 5 cm.</text><rect x="52" y="1056.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1096.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1141.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">After feedback, change the boundary to 5.</text><text x="52" y="1197.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>