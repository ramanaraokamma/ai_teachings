<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="621" viewBox="0 0 1200 621" role="img" aria-labelledby="title desc"><title id="title">Operational Labels: the case</title><desc id="desc">Two fictional catalogue reviewers label books compact or extended. Supplied facts: Agreed policy: compact means at most 80 pages; extended means more than 80. Reviewer A uses pages&lt;80; reviewer B uses pages&lt;=80. Inspect books of 79,80,81 pages.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="621" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/8 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Operational Labels: the case</tspan></text><rect x="38" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 Q31 12 46 21 Q64 12 82 19 V74 Q64 66 46 77 Q30 66 12 74 Z"/><path d="M46 21 V77 M21 31 L36 34 M56 33 L73 30 M21 43 L36 46 M56 45 L73 42"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Two fictional catalogue reviewers label</tspan><tspan x="63" dy="32.66">books compact or extended.</tspan></text><rect x="627" y="161" width="535" height="321" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Agreed policy: compact means at most 80</tspan><tspan x="652" dy="32.66">pages; extended means more than 80.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">Reviewer A uses pages&lt;80; reviewer B</tspan><tspan x="652" dy="32.66">uses pages&lt;=80. Inspect books of 79,80,81</tspan><tspan x="652" dy="32.66">pages.</tspan></text><rect x="38" y="512" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="545" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can resolve label disagreement by checking an operational definition at equality.</tspan></text></g></svg>