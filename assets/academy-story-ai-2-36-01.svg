<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc"><title id="title">Capstone Expo: the case</title><desc id="desc">A fictional team presents its transparent book recommender on a supplied practice catalogue. Supplied facts: Request maximum 120 pages; score=2×interest+illustrated, where illustrated is 1 for True and 0 for False; tie by ID. A pages120 interest3 True; B pages100 interest4 False; C pages121 interest5 True; D pages90 interest&quot;4&quot; True. Numeric fields require exact integers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="752" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/36 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Capstone Expo: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">A fictional team presents its transparent</tspan><tspan x="63" dy="32.66">book recommender on a supplied practice</tspan><tspan x="63" dy="32.66">catalogue.</tspan></text><rect x="627" y="161" width="535" height="419" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Request maximum 120 pages;</tspan><tspan x="652" dy="32.66">score=2×interest+illustrated, where</tspan><tspan x="652" dy="32.66">illustrated is 1 for True and 0 for False; tie</tspan><tspan x="652" dy="32.66">by ID.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">A pages120 interest3 True; B pages100</tspan><tspan x="652" dy="32.66">interest4 False; C pages121 interest5 True;</tspan><tspan x="652" dy="32.66">D pages90 interest&quot;4&quot; True. Numeric fields</tspan><tspan x="652" dy="32.66">require exact integers.</tspan></text><rect x="38" y="610" width="1124" height="113" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="643" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can defend a complete recommendation with validation, eligibility and reproducible</tspan><tspan x="62" dy="32.66">ranking.</tspan></text></g></svg>