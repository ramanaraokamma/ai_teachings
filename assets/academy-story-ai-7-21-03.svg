<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Predefining an analysis plan — evidence trace</title><desc id="desc">Predefining an analysis plan — evidence trace. Plan includes all 20 cases. After results, the team removes four failed cases because they make the graph look worse. | Declare primary metric, eligible cases, missing handling, baseline, test assumptions and reporting. Timestamp/version the plan; label later choices exploratory. | The exclusion is outcome-informed and violates the plan. If the other 16 cases all passed, report the original 16/20; otherwise use the actual pass count out of 20, and label any revised analysis with reasons rather than hiding failures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/21 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Predefining an analysis plan — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Plan includes all 20 cases.</tspan><tspan x="52.0" dy="32.66">After results, the team</tspan><tspan x="52.0" dy="32.66">removes four failed cases</tspan><tspan x="52.0" dy="32.66">because they make the graph</tspan><tspan x="52.0" dy="32.66">look worse.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Declare primary metric, eligible</tspan><tspan x="426.6666666666667" dy="32.66">cases, missing handling,</tspan><tspan x="426.6666666666667" dy="32.66">baseline, test assumptions and</tspan><tspan x="426.6666666666667" dy="32.66">reporting. Timestamp/version</tspan><tspan x="426.6666666666667" dy="32.66">the plan; label later choices</tspan><tspan x="426.6666666666667" dy="32.66">exploratory.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">The exclusion is</tspan><tspan x="801.3333333333334" dy="32.66">outcome-informed and violates</tspan><tspan x="801.3333333333334" dy="32.66">the plan. If the other 16 cases</tspan><tspan x="801.3333333333334" dy="32.66">all passed, report the original</tspan><tspan x="801.3333333333334" dy="32.66">16/20; otherwise use the</tspan><tspan x="801.3333333333334" dy="32.66">actual pass count out of 20,</tspan><tspan x="801.3333333333334" dy="32.66">and label any revised analysis</tspan><tspan x="801.3333333333334" dy="32.66">with reasons rather than hiding</tspan><tspan x="801.3333333333334" dy="32.66">failures.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>