<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Change the rule. Keep the forecast.</title><desc id="desc">With a 70 percent rain forecast, a 60 percent-or-more rule displays TAKE ONE. An 80 percent-or-more rule does not trigger that message. Only the boundary changed; the fitted model and forecast did not.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY  /  LEVEL 1 · WEEK 1</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Change the rule. Keep the forecast.</tspan></text><rect x="38" y="138" width="1124" height="87" rx="22" fill="#e8f1fa" stroke="#bed2e4" stroke-width="2"/><text x="62" y="190" fill="#205fa1" font-size="26" font-weight="750"><tspan x="62" dy="0">SAME FITTED MODEL + SAME INPUT → SAME FORECAST: 70%</tspan></text><rect x="38" y="252" width="535" height="315" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="62" y="274" width="310" height="34" rx="17" fill="#fff" stroke="#086c68" stroke-width="2"/><text x="76" y="298" fill="#086c68" font-size="15" font-weight="750"><tspan x="76" dy="0">BOUNDARY: 60% OR MORE</tspan></text><text x="64" y="381" fill="#086c68" font-size="49" font-weight="750"><tspan x="64" dy="0">70 ≥ 60</tspan></text><rect x="62" y="413" width="487" height="99" rx="13" fill="#17384c" stroke="#17384c" stroke-width="2"/><text x="84" y="469" fill="#fff" font-size="29" font-weight="750"><tspan x="84" dy="0">TAKE ONE</tspan></text><rect x="627" y="252" width="535" height="315" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="651" y="274" width="310" height="34" rx="17" fill="#fff" stroke="#6541a5" stroke-width="2"/><text x="665" y="298" fill="#6541a5" font-size="15" font-weight="750"><tspan x="665" dy="0">BOUNDARY: 80% OR MORE</tspan></text><text x="653" y="381" fill="#6541a5" font-size="49" font-weight="750"><tspan x="653" dy="0">70 &lt; 80</tspan></text><rect x="651" y="413" width="487" height="99" rx="13" fill="#17384c" stroke="#17384c" stroke-width="2"/><text x="673" y="469" fill="#fff" font-size="29" font-weight="750"><tspan x="673" dy="0">Rule does not trigger</tspan></text><text x="62" y="620" fill="#17384c" font-size="23" font-weight="500"><tspan x="62" dy="0">Only the written display boundary changed. The model was not refitted.</tspan><tspan x="62" dy="32.199999999999996">At an exact boundary (60% with a 60% rule), “or more” includes equality.</tspan></text></g></svg>