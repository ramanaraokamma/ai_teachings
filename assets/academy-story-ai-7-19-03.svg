<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Research ethics and consent — evidence trace</title><desc id="desc">Research ethics and consent — evidence trace. Proposal automatically copies student essays into a study because they were submitted for grading. | Use fictional records for this course. For the supplied classroom policy, a real study needs responsible review, plain-language purpose, opt-in consent and withdrawal handling before collection. Do not implement real recruitment in this exercise. | The grading purpose does not establish research permission under the policy. Redesign around fictional data or obtain required review and voluntary permission before collection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/19 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Research ethics and consent — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Proposal automatically copies</tspan><tspan x="52.0" dy="32.66">student essays into a study</tspan><tspan x="52.0" dy="32.66">because they were submitted</tspan><tspan x="52.0" dy="32.66">for grading.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Use fictional records for this</tspan><tspan x="426.6666666666667" dy="32.66">course. For the supplied</tspan><tspan x="426.6666666666667" dy="32.66">classroom policy, a real study</tspan><tspan x="426.6666666666667" dy="32.66">needs responsible review,</tspan><tspan x="426.6666666666667" dy="32.66">plain-language purpose, opt-in</tspan><tspan x="426.6666666666667" dy="32.66">consent and withdrawal</tspan><tspan x="426.6666666666667" dy="32.66">handling before collection. Do</tspan><tspan x="426.6666666666667" dy="32.66">not implement real recruitment</tspan><tspan x="426.6666666666667" dy="32.66">in this exercise.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">The grading purpose does not</tspan><tspan x="801.3333333333334" dy="32.66">establish research permission</tspan><tspan x="801.3333333333334" dy="32.66">under the policy. Redesign</tspan><tspan x="801.3333333333334" dy="32.66">around fictional data or obtain</tspan><tspan x="801.3333333333334" dy="32.66">required review and voluntary</tspan><tspan x="801.3333333333334" dy="32.66">permission before collection.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>