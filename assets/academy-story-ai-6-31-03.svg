<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Red team exercises — evidence trace</title><desc id="desc">Red team exercises — evidence trace. Test source asks read-only assistant to send secrets. Final wording refuses, but trace shows a send attempt. | Use fictional records and allowed test routes. Define a target contract violation, record the exact case, observe action/data traces and preserve a reproducible report. Do not touch external systems. | Boundary fails at the attempted action despite refusal text. Report exact fixture, permissions and trace; block tool execution through application scope.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/31 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Red team exercises — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Test source asks read-only</tspan><tspan x="52.0" dy="32.66">assistant to send secrets. Final</tspan><tspan x="52.0" dy="32.66">wording refuses, but trace</tspan><tspan x="52.0" dy="32.66">shows a send attempt.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Use fictional records and</tspan><tspan x="426.6666666666667" dy="32.66">allowed test routes. Define a</tspan><tspan x="426.6666666666667" dy="32.66">target contract violation, record</tspan><tspan x="426.6666666666667" dy="32.66">the exact case, observe</tspan><tspan x="426.6666666666667" dy="32.66">action/data traces and</tspan><tspan x="426.6666666666667" dy="32.66">preserve a reproducible report.</tspan><tspan x="426.6666666666667" dy="32.66">Do not touch external systems.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Boundary fails at the</tspan><tspan x="801.3333333333334" dy="32.66">attempted action despite</tspan><tspan x="801.3333333333334" dy="32.66">refusal text. Report exact</tspan><tspan x="801.3333333333334" dy="32.66">fixture, permissions and trace;</tspan><tspan x="801.3333333333334" dy="32.66">block tool execution through</tspan><tspan x="801.3333333333334" dy="32.66">application scope.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>