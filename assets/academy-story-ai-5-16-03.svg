<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Patience two with strict improvement</title><desc id="desc">Patience two with strict improvement. 0 then 1 then 2 | 4 then 2 then 1.5 | Save each improved state. 3 then 4 | 1.6 then 1.4 | Wait once then reset. 5 then 6 | 1.45 then 1.46 | Two misses so stop at 6</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-5/16 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Patience two with strict improvement</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Epoch</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Validation MSE</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Decision</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">0 then 1 then 2</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">4 then 2 then 1.5</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Save each improved state</tspan></text><rect x="38.0" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">3 then 4</tspan></text><rect x="412.6666666666667" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">1.6 then 1.4</tspan></text><rect x="787.3333333333334" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Wait once then reset</tspan></text><rect x="38.0" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">5 then 6</tspan></text><rect x="412.6666666666667" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">1.45 then 1.46</tspan></text><rect x="787.3333333333334" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Two misses so stop at 6</tspan></text><text x="50" y="471" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Initial checkpoint is epoch 0. Evaluate once after each epoch. A strict decrease is improvement; an exact</tspan><tspan x="50" dy="31.24">tie is a miss. Reset the miss count after improvement and stop at two consecutive misses. Restore epoch</tspan><tspan x="50" dy="31.24">4, the best observed checkpoint.</tspan></text></g></svg>