<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Capstone requirements and corpus — evidence trace</title><desc id="desc">Capstone requirements and corpus — evidence trace. Student room assistant corpus contains public register P, teacher-only guide T and current approval A. It must report approved room capacity or needs_review. | Specify the user question, source authority, access, output/fallback contract and evaluation plan. Freeze corpus IDs and split cases before implementation. Keep teacher material out of student retrieval. | Authorised corpus contains P and A, excluding T. Baseline manually checks same-room current approval and capacity. Reserve complete, missing and conflicting cases before development.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/33 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Capstone requirements and corpus — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Student room assistant corpus</tspan><tspan x="52.0" dy="32.66">contains public register P,</tspan><tspan x="52.0" dy="32.66">teacher-only guide T and</tspan><tspan x="52.0" dy="32.66">current approval A. It must</tspan><tspan x="52.0" dy="32.66">report approved room capacity</tspan><tspan x="52.0" dy="32.66">or needs_review.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Specify the user question,</tspan><tspan x="426.6666666666667" dy="32.66">source authority, access,</tspan><tspan x="426.6666666666667" dy="32.66">output/fallback contract and</tspan><tspan x="426.6666666666667" dy="32.66">evaluation plan. Freeze corpus</tspan><tspan x="426.6666666666667" dy="32.66">IDs and split cases before</tspan><tspan x="426.6666666666667" dy="32.66">implementation. Keep teacher</tspan><tspan x="426.6666666666667" dy="32.66">material out of student</tspan><tspan x="426.6666666666667" dy="32.66">retrieval.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Authorised corpus contains P</tspan><tspan x="801.3333333333334" dy="32.66">and A, excluding T. Baseline</tspan><tspan x="801.3333333333334" dy="32.66">manually checks same-room</tspan><tspan x="801.3333333333334" dy="32.66">current approval and capacity.</tspan><tspan x="801.3333333333334" dy="32.66">Reserve complete, missing</tspan><tspan x="801.3333333333334" dy="32.66">and conflicting cases before</tspan><tspan x="801.3333333333334" dy="32.66">development.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>