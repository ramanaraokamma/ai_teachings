<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Approval gates and idempotency — evidence trace</title><desc id="desc">Approval gates and idempotency — evidence trace. Approved send v1 to D uses key K, commits once, then caller retries K with the identical payload. | The mock submission requires approval for request version v1 and destination D. Store key -&gt; committed result. Reusing the same key with the same payload returns that result; the same key with different payload is rejected. | Return the stored committed result; one effect total. A timeout alone is not evidence the first effect failed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/15 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Approval gates and idempotency — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Approved send v1 to D uses</tspan><tspan x="52.0" dy="32.66">key K, commits once, then</tspan><tspan x="52.0" dy="32.66">caller retries K with the</tspan><tspan x="52.0" dy="32.66">identical payload.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">The mock submission requires</tspan><tspan x="426.6666666666667" dy="32.66">approval for request version v1</tspan><tspan x="426.6666666666667" dy="32.66">and destination D. Store key -&gt;</tspan><tspan x="426.6666666666667" dy="32.66">committed result. Reusing the</tspan><tspan x="426.6666666666667" dy="32.66">same key with the same</tspan><tspan x="426.6666666666667" dy="32.66">payload returns that result; the</tspan><tspan x="426.6666666666667" dy="32.66">same key with different</tspan><tspan x="426.6666666666667" dy="32.66">payload is rejected.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Return the stored committed</tspan><tspan x="801.3333333333334" dy="32.66">result; one effect total. A</tspan><tspan x="801.3333333333334" dy="32.66">timeout alone is not evidence</tspan><tspan x="801.3333333333334" dy="32.66">the first effect failed.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>