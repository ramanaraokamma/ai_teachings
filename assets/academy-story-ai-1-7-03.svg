<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="698" viewBox="0 0 1200 698" role="img" aria-labelledby="title desc"><title id="title">Three ordered checks for a calendar card</title><desc id="desc">Three ordered checks for a calendar card. First check known values | Any known field fails its criterion | Revise even if another field is unknown. Then check missing information | No known failure but a field is blank or unreadable | Review because evidence is incomplete. Otherwise all checks have passed | Day is 1 through 30 and room is A or B | Ready under this record policy</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="698" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-1/7 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Three ordered checks for a calendar card</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Check in this order</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Evidence</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Recorded label</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">First check known values</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Any known field fails its</tspan><tspan x="426.6666666666667" dy="32.66">criterion</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Revise even if another field is</tspan><tspan x="801.3333333333334" dy="32.66">unknown</tspan></text><rect x="38.0" y="333" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="364" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Then check missing</tspan><tspan x="52.0" dy="32.66">information</tspan></text><rect x="412.6666666666667" y="333" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="364" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">No known failure but a field is</tspan><tspan x="426.6666666666667" dy="32.66">blank or unreadable</tspan></text><rect x="787.3333333333334" y="333" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="364" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Review because evidence is</tspan><tspan x="801.3333333333334" dy="32.66">incomplete</tspan></text><rect x="38.0" y="437" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="468" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Otherwise all checks have</tspan><tspan x="52.0" dy="32.66">passed</tspan></text><rect x="412.6666666666667" y="437" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="468" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Day is 1 through 30 and room</tspan><tspan x="426.6666666666667" dy="32.66">is A or B</tspan></text><rect x="787.3333333333334" y="437" width="368.6666666666667" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="468" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Ready under this record policy</tspan></text><text x="50" y="570" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Stop at the first matching row. The order resolves a card with both a known failure and an unknown field.</tspan><tspan x="50" dy="31.24">Ready describes the printed record under this policy; it does not confirm that the event exists or has</tspan><tspan x="50" dy="31.24">permission to run.</tspan></text></g></svg>