<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Retrieval and indexing — evidence trace</title><desc id="desc">Retrieval and indexing — evidence trace. Index v1 contains notice N1 for room A. Corpus v2 supersedes it with N2 for room B, but the query still returns N1. What can be reported? | Assign stable document IDs, versions and permitted access before indexing. Retrieve only authorised records. Preserve source references and define behaviour when a document is missing, outdated or access-restricted. | The stale index returns old evidence. It cannot establish current room approval; refresh against authorised corpus v2 or report unresolved freshness.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/17 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Retrieval and indexing — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Index v1 contains notice N1 for</tspan><tspan x="52.0" dy="32.66">room A. Corpus v2 supersedes</tspan><tspan x="52.0" dy="32.66">it with N2 for room B, but the</tspan><tspan x="52.0" dy="32.66">query still returns N1. What</tspan><tspan x="52.0" dy="32.66">can be reported?</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Assign stable document IDs,</tspan><tspan x="426.6666666666667" dy="32.66">versions and permitted access</tspan><tspan x="426.6666666666667" dy="32.66">before indexing. Retrieve only</tspan><tspan x="426.6666666666667" dy="32.66">authorised records. Preserve</tspan><tspan x="426.6666666666667" dy="32.66">source references and define</tspan><tspan x="426.6666666666667" dy="32.66">behaviour when a document is</tspan><tspan x="426.6666666666667" dy="32.66">missing, outdated or</tspan><tspan x="426.6666666666667" dy="32.66">access-restricted.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">The stale index returns old</tspan><tspan x="801.3333333333334" dy="32.66">evidence. It cannot establish</tspan><tspan x="801.3333333333334" dy="32.66">current room approval; refresh</tspan><tspan x="801.3333333333334" dy="32.66">against authorised corpus v2</tspan><tspan x="801.3333333333334" dy="32.66">or report unresolved</tspan><tspan x="801.3333333333334" dy="32.66">freshness.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>