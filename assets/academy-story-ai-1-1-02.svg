<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Who or what makes this decision?</title><desc id="desc">A remote-controlled car follows human commands, a motion lamp follows a written rule, and a trained photo sorter applies a learned model. A product can combine mechanisms. AI also includes symbolic reasoning.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY  /  LEVEL 1 · WEEK 1</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Who or what makes this decision?</tspan></text><rect x="38" y="138" width="356" height="408" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="58" y="158" width="310" height="34" rx="17" fill="#fff" stroke="#086c68" stroke-width="2"/><text x="72" y="182" fill="#086c68" font-size="15" font-weight="750"><tspan x="72" dy="0">HUMAN COMMAND</tspan></text><g transform="translate(145 216) scale(1.05)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M25 35h80q20 0 22 30l3 27q0 22-22 9L89 85H40l-20 16Q-2 114 2 91l4-27q3-29 19-29Z" fill="#e0f2ef"/><path d="M24 60h24M36 48v24"/><circle cx="94" cy="57" r="4"/><circle cx="110" cy="71" r="4"/></g><text x="60" y="380" fill="#17384c" font-size="24" font-weight="750"><tspan x="60" dy="0">Remote-controlled car</tspan></text><text x="60" y="426" fill="#17384c" font-size="22" font-weight="500"><tspan x="60" dy="0">A person sends each</tspan><tspan x="60" dy="30.799999999999997">steering instruction.</tspan></text><rect x="422" y="138" width="356" height="408" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="442" y="158" width="310" height="34" rx="17" fill="#fff" stroke="#6541a5" stroke-width="2"/><text x="456" y="182" fill="#6541a5" font-size="15" font-weight="750"><tspan x="456" dy="0">WRITTEN RULE</tspan></text><g transform="translate(529 216) scale(1.05)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M42 79C-3 38 20 2 62 2s64 38 22 77l-8 16H48Z" fill="#ffe9a6"/><path d="M48 104h28m-25 10h22"/></g><text x="444" y="380" fill="#17384c" font-size="24" font-weight="750"><tspan x="444" dy="0">Motion-triggered lamp</tspan></text><text x="444" y="426" fill="#17384c" font-size="22" font-weight="500"><tspan x="444" dy="0">A person wrote:</tspan><tspan x="444" dy="30.799999999999997">if motion, turn on.</tspan></text><rect x="806" y="138" width="356" height="408" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="826" y="158" width="310" height="34" rx="17" fill="#fff" stroke="#205fa1" stroke-width="2"/><text x="840" y="182" fill="#205fa1" font-size="15" font-weight="750"><tspan x="840" dy="0">LEARNED MODEL</tspan></text><g transform="translate(913 216) scale(1.05)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="7" width="105" height="96" rx="8" fill="#e3effa"/><path d="M17 90l31-38 25 25 16-21 17 34" fill="#9edbd2"/><circle cx="88" cy="29" r="10" fill="#f4c55c"/></g><text x="828" y="380" fill="#17384c" font-size="24" font-weight="750"><tspan x="828" dy="0">Trained photo sorter</tspan></text><text x="828" y="426" fill="#17384c" font-size="22" font-weight="500"><tspan x="828" dy="0">Fitted on labelled pictures;</tspan><tspan x="828" dy="30.799999999999997">predicts a new label.</tspan></text><rect x="38" y="572" width="1124" height="110" rx="22" fill="#fff3df" stroke="#e8c995" stroke-width="2"/><text x="62" y="612" fill="#17384c" font-size="22" font-weight="500"><tspan x="62" dy="0">A single product can combine all three.</tspan><tspan x="62" dy="30.799999999999997">AI also includes symbolic reasoning. A simple switch alone does not classify a whole product.</tspan></text></g></svg>