<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" role="img" aria-labelledby="title desc"><title id="title">Change one thing. Trace what follows.</title><desc id="desc">Original case: v becomes 1; prediction 3 and loss 0. Next gradient is 0. Changed condition: Change target from 3 to6 and restart v = 0 with the same rate. Expected result: First gradient=-36; v becomes 2; prediction 6 and loss 0. Reason: The hidden value remains 3, but the target residual and required output weight double.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="662" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-5/12 · 04 · COMPARE THE CASES</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Change one thing. Trace what follows.</tspan></text><rect x="38" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">Original case</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">v becomes 1; prediction 3 and loss 0. Next</tspan><tspan x="63" dy="32.66">gradient is 0.</tspan></text><rect x="627" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12 H46 M29 12 V44 L12 77 Q9 83 17 84 H54 Q62 83 59 77 L42 44 V12 M19 64 H52 M65 20 H83 M68 20 V68 Q75 88 80 68 V20 M69 55 H79"/></g><text x="737" y="201" fill="#6541a5" font-size="24" font-weight="750"><tspan x="737" dy="0">Changed condition</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Change target from 3 to6 and restart v = 0</tspan><tspan x="652" dy="32.66">with the same rate.</tspan></text><rect x="38" y="409" width="1124" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 426) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="17" width="43" height="61" rx="7"/><path d="M10 47 H62 M48 33 L62 47 L48 61"/></g><text x="148" y="449" fill="#086c68" font-size="24" font-weight="750"><tspan x="148" dy="0">Worked changed-case result</tspan></text><text x="63" y="509" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">First gradient=-36; v becomes 2; prediction 6 and loss 0.</tspan><tspan x="63" dy="32.66"></tspan><tspan x="63" dy="32.66">Why: The hidden value remains 3, but the target residual and required output weight double.</tspan></text></g></svg>