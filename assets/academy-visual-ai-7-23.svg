<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1066" viewBox="0 0 1120 1066"><rect x="0" y="0" width="1120" height="1066" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-7/23</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Power and resource tradeoffs</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="158" rx="5" fill="#147d87"/><circle cx="131" cy="391.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,344.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Estimate simulated detection</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Observed detection fractions are 60/100=60% and</text><text x="216" y="447.4" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">80/100=80%.</text><path d="M560 477.7 V497.7 M550 489.7 L560 499.7 L570 489.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="507.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="507.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="582.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,535.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="216" y="550.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Calculate design cost</text><text x="216" y="601.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">n=20 costs 40 resource units; n=40 costs 80 units.</text><path d="M560 664.7 V684.7 M550 676.7 L560 686.7 L570 676.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="694.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="694.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="773.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,726.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="36"/><path d="M31 33 Q34 17 51 22 Q72 30 56 45 Q47 51 47 60"/><circle cx="47" cy="72" r="2"/></g><text x="216" y="737.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Compare the trade-off</text><text x="216" y="788.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Doubling cost adds 20 percentage points of simulated</text><text x="216" y="829.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">detection under these assumptions.</text><rect x="52" y="877.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="917.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="962.8000000000001" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Change the assumed effect or variability but keep the sample sizes.</text><text x="52" y="1018.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>