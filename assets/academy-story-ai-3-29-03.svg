33333333334" dy="32.66">attribution. Keep licence</tspan><tspan x="801.3333333333334" dy="32.66">version and provenance.</tspan></text><text x="50" y="626" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>