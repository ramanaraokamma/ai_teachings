<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="title desc"><title id="title">Follow the deciding steps</title><desc id="desc">Recall the prediction: The claim was a higher correct count for B. → State the finding: Both versions score 75%; no observed count advantage appears here. → Revise cautiously: Report the unsupported prediction and a justified next test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="696" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/28 · 02 · TRACE THE CASE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Follow the deciding steps</tspan></text><rect x="38" y="161" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 195) scale(0.9)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 Q31 12 46 21 Q64 12 82 19 V74 Q64 66 46 77 Q30 66 12 74 Z"/><path d="M46 21 V77 M21 31 L36 34 M56 33 L73 30 M21 43 L36 46 M56 45 L73 42"/></g><text x="203" y="199" fill="#205fa1" font-size="26" font-weight="750"><tspan x="203" dy="0">01  Recall the prediction</tspan></text><text x="204" y="243" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">The claim was a higher correct count for B.</tspan></text><path d="M600 306 L600 331" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="341" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 375) scale(0.9)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="ro