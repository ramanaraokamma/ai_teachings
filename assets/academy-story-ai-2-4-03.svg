<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="861" viewBox="0 0 1200 861" role="img" aria-labelledby="title desc"><title id="title">Loop totals after each iteration</title><desc id="desc">Loop totals after each iteration. First: turn = 0, total after update = 4. Second: turn = 1, total after update = 7. Third: turn = 2, total after update = 10. Fourth: turn = 3, total after update = 13.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="861" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(60 16) scale(0.9143518518518519)"><rect width="1120" height="864" rx="25" fill="#f5f9fc"/><text x="52" y="54" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-2/4</text><text x="52" y="106" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#123c55">Loop totals after each iteration</text><text x="300.0" y="192.3" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#146b77">turn</text><text x="680.0" y="192.3" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#146b77">total after update</text><text x="52" y="327.3" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#183249">First</text><rect x="290.0" y="282.3" width="375.0" height="105" rx="8" fill="#c9e4e8" stroke="#7ca9b8"/><text x="306.0" y="341.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">0</text><rect x="670.0" y="282.3" width="375.0" height="105" rx="8" fill="#e1eff4" stroke="#7ca9b8"/><text x="686.0" y="341.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">4</text><text x="52" y="445.3" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#183249">Second</text><rect x="290.0" y="400.3" width="375.0" height="105" rx="8" fill="#e1eff4" stroke="#7ca9b8"/><text x="306.0" y="459.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">1</text><rect x="670.0" y="400.3" width="375.0" height="105" rx="8" fill="#c9e4e8" stroke="#7ca9b8"/><text x="686.0" y="459.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">7</text><text x="52" y="563.3" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#183249">Third</text><rect x="290.0" y="518.3" width="375.0" height="105" rx="8" fill="#c9e4e8" stroke="#7ca9b8"/><text x="306.0" y="577.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">2</text><rect x="670.0" y="518.3" width="375.0" height="105" rx="8" fill="#e1eff4" stroke="#7ca9b8"/><text x="686.0" y="577.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">10</text><text x="52" y="681.3" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" fill="#183249">Fourth</text><rect x="290.0" y="636.3" width="375.0" height="105" rx="8" fill="#e1eff4" stroke="#7ca9b8"/><text x="306.0" y="695.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">3</text><rect x="670.0" y="636.3" width="375.0" height="105" rx="8" fill="#c9e4e8" stroke="#7ca9b8"/><text x="686.0" y="695.3" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#183249">13</text><text x="52" y="779.3" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Read a cell using both its row and column labels.</text></g></g></svg>