<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">Keep analysis records separate from the identity key</title><desc id="desc">Analysts receive random participant codes and scores. A separate restricted key links codes to names only for authorised withdrawal handling. Keeping the key restricted reduces exposure; it does not guarantee anonymity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="770" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/20 · 03 · MAP PURPOSE AND ACCESS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Keep analysis records separate from the identity key</tspan></text><rect x="38" y="161" width="535" height="300" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(243 185) scale(1)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="63" y="331" fill="#205fa1" font-size="26" font-weight="750"><tspan x="63" dy="0">Analysis table</tspan></text><text x="63" y="380" fill="#17384c" font-size="24" font-weight="500"><tspan x="63" dy="0">Random codes + task scores</tspan></text><rect x="627" y="161" width="535" height="300" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(832 185) scale(1)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="652" y="331" fill="#6541a5" font-size="26" font-weight="750"><tspan x="652" dy="0">Restricted identity key</tspan></text><text x="652" y="380" fill="#17384c" font-size="24" font-weight="500"><tspan x="652" dy="0">Codes linked to names</tspan></text><rect x="38" y="496" width="1124" height="132" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="535" fill="#086c68" font-size="25" font-weight="750"><tspan x="62" dy="0">Analysts receive codes and scores, not the name linkage.</tspan></text><text x="62" y="580" fill="#17384c" font-size="23" font-weight="500"><tspan x="62" dy="0">Authorised withdrawal handling may use the restricted key.</tspan></text><text x="62" y="670" fill="#975014" font-size="25" font-weight="750"><tspan x="62" dy="0">Pseudonymous is not guaranteed anonymous: a linkage key still exists.</tspan></text></g></svg>