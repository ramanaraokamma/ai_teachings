<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Image and Voice Pipelines: the case</title><desc id="desc">A fictional librarian dictates a shelf note that passes through transcription and catalogue lookup. Supplied facts: Teacher-supplied ground truth audio phrase is “shelf fourteen”. Transcript says “shelf forty”. A current signed inventory is declared authoritative and lists the requested book on shelf 14. The original audio recording remains available.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/26 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Image and Voice Pipelines: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="12"/><path d="M25 25 Q6 47 25 69 M69 25 Q88 47 69 69 M34 34 Q23 47 34 60 M60 34 Q71 47 60 60"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">A fictional librarian dictates a shelf note that</tspan><tspan x="63" dy="32.66">passes through transcription and catalogue</tspan><tspan x="63" dy="32.66">lookup.</tspan></text><rect x="627" y="161" width="535" height="387" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Teacher-supplied ground truth audio phrase</tspan><tspan x="652" dy="32.66">is “shelf fourteen”. Transcript says “shelf</tspan><tspan x="652" dy="32.66">forty”.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">A current signed inventory is declared</tspan><tspan x="652" dy="32.66">authoritative and lists the requested book on</tspan><tspan x="652" dy="32.66">shelf 14. The original audio recording</tspan><tspan x="652" dy="32.66">remains available.</tspan></text><rect x="38" y="578" width="1124" height="113" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="611" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can trace where speech information changes and resolve a declared-authority</tspan><tspan x="62" dy="32.66">conflict.</tspan></text></g></svg>