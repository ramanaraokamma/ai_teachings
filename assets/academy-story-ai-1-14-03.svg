<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Three records through the Tower1 classifier</title><desc id="desc">Three records through the Tower1 classifier. 5 cm | Accepted; 5 is below 6 | Tower1 predicts short. 6 cm | Accepted; 6 is at least 6 | Tower1 predicts tall. Height blank | Missing height; stop before rule | Tower1; no prediction</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-1/14 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Three records through the Tower1 classifier</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input record</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check and rule</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Recorded outcome</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">5 cm</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Accepted; 5 is below 6</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Tower1 predicts short</tspan></text><rect x="38.0" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">6 cm</tspan></text><rect x="412.6666666666667" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Accepted; 6 is at least 6</tspan></text><rect x="787.3333333333334" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Tower1 predicts tall</tspan></text><rect x="38.0" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Height blank</tspan></text><rect x="412.6666666666667" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Missing height; stop before</tspan><tspan x="426.6666666666667" dy="32.66">rule</tspan></text><rect x="787.3333333333334" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Tower1; no prediction</tspan></text><text x="50" y="471" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Read each row from left to right. An accepted input reaches the threshold rule. A missing input stops</tspan><tspan x="50" dy="31.24">before that rule and receives an explicit no prediction outcome.</tspan></text></g></svg>