<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1074" viewBox="0 0 1120 1074"><rect x="0" y="0" width="1120" height="1074" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-5/27</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Similarity and normalisation</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="158" rx="5" fill="#147d87"/><circle cx="131" cy="391.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,344.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Raw distances</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">P distance36; Q distance1, so Q is closer in raw</text><text x="216" y="447.4" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">coordinates.</text><path d="M560 477.7 V497.7 M550 489.7 L560 499.7 L570 489.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="507.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="507.7" width="10" height="158" rx="5" fill="#35699d"/><circle cx="131" cy="586.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,539.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="20" r="7"/><circle cx="15" cy="73" r="7"/><circle cx="47" cy="20" r="7"/><circle cx="47" cy="47" r="7"/><circle cx="47" cy="73" r="7"/><circle cx="79" cy="47" r="8"/><path d="M22 20 H40 M22 20 L40 47 M22 20 L40 73 M22 73 L40 20 M22 73 L40 47 M22 73 H40 M54 20 L71 42 M54 47 H71 M54 73 L71 52"/></g><text x="216" y="550.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Angular similarity</text><text x="216" y="601.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">CosineP=1; cosineQ=2/sqrt5≈0.8944, so P aligns more</text><text x="216" y="642.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">closely.</text><path d="M560 672.7 V692.7 M550 684.7 L560 694.7 L570 684.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="702.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="702.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="781.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,734.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="216" y="745.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Normalise</text><text x="216" y="796.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Unit query [1, 0], P [1, 0], Q [2/sqrt5, 1/sqrt5]; normalised</text><text x="216" y="837.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">distanceP0.</text><rect x="52" y="885.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="925.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="970.8000000000001" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Replace P with [0, 0].</text><text x="52" y="1026.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>