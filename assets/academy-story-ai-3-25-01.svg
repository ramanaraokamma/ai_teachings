<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="719" viewBox="0 0 1200 719" role="img" aria-labelledby="title desc"><title id="title">Quality Rubrics: the case</title><desc id="desc">Use a quality rubric whose safety gate cannot be traded for attractive formatting. Supplied facts: Approved S1 says: “A root anchors a plant in soil.” Rubric: every claim supported by S1, at most two sentences. Draft: “A root anchors a plant in soil. Roots grow exactly 2 cm each day.” All inputs and outcomes in this worked example are invented classroom data; no real model run is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="719" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/25 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Quality Rubrics: the case</tspan></text><rect x="38" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 Q31 12 46 21 Q64 12 82 19 V74 Q64 66 46 77 Q30 66 12 74 Z"/><path d="M46 21 V77 M21 31 L36 34 M56 33 L73 30 M21 43 L36 46 M56 45 L73 42"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Use a quality rubric whose safety gate</tspan><tspan x="63" dy="32.66">cannot be traded for attractive formatting.</tspan></text><rect x="627" y="161" width="535" height="419" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Approved S1 says: “A root anchors a plant</tspan><tspan x="652" dy="32.66">in soil.” Rubric: every claim supported by</tspan><tspan x="652" dy="32.66">S1, at most two sentences. Draft: “A root</tspan><tspan x="652" dy="32.66">anchors a plant in soil. Roots grow exactly 2</tspan><tspan x="652" dy="32.66">cm each day.”</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">All inputs and outcomes in this worked</tspan><tspan x="652" dy="32.66">example are invented classroom data; no</tspan><tspan x="652" dy="32.66">real model run is claimed.</tspan></text><rect x="38" y="610" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="643" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can explain quality rubrics using a traced example and a stated limitation.</tspan></text></g></svg>