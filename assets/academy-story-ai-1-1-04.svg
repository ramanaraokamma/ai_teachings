<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Learn first. Predict later.</title><desc id="desc">Earlier weather records are used to fit a model. Later, new measurements are passed to that fitted model to obtain a 70 percent rain forecast. It is an estimate, not a guarantee.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY  /  LEVEL 1 · WEEK 1</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Learn first. Predict later.</tspan></text><rect x="38" y="139" width="1124" height="191" rx="22" fill="#e9f2fb" stroke="#b8d1e7" stroke-width="2"/><rect x="62" y="157" width="270" height="34" rx="17" fill="#fff" stroke="#205fa1" stroke-width="2"/><text x="76" y="181" fill="#205fa1" font-size="15" font-weight="750"><tspan x="76" dy="0">EARLIER: FIT THE MODEL</tspan></text><g transform="translate(78 202) scale(0.8)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="105" height="110" rx="10" fill="#e3effa"/><path d="M30 30h60m-60 25h60m-60 25h60m-42-50v65m23-65v65"/></g><text x="218" y="242" fill="#17384c" font-size="23" font-weight="500"><tspan x="218" dy="0">Earlier weather records</tspan><tspan x="218" dy="32.199999999999996">Examples used during fitting</tspan></text><path d="M565 250 L663 250" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(699 199) scale(0.85)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="25" r="10" fill="#c5e8e2"/><circle cx="20" cy="85" r="10" fill="#c5e8e2"/><circle cx="65" cy="55" r="15" fill="#88c8bf"/><circle cx="110" cy="25" r="10" fill="#c5e8e2"/><circle cx="110" cy="85" r="10" fill="#c5e8e2"/><path d="M30 28l23 19m-23 35 23-19m27-15 20-18m-20 34 20 18"/></g><text x="851" y="245" fill="#17384c" font-size="24" font-weight="750"><tspan x="851" dy="0">Fitted weather</tspan><tspan x="851" dy="33.599999999999994">model</tspan></text><rect x="38" y="358" width="1124" height="215" rx="22" fill="#e6f4ef" stroke="#b2d6cb" stroke-width="2"/><rect x="62" y="376" width="255" height="34" rx="17" fill="#fff" stroke="#086c68" stroke-width="2"/><text x="76" y="400" fill="#086c68" font-size="15" font-weight="750"><tspan x="76" dy="0">NOW: USE THE MODEL</tspan></text><text x="65" y="476" fill="#17384c" font-size="23" font-weight="500"><tspan x="65" dy="0">New weather</tspan><tspan x="65" dy="32.199999999999996">measurements</tspan></text><path d="M272 467 L345 467" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(374 412) scale(0.8)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="25" r="10" fill="#c5e8e2"/><circle cx="20" cy="85" r="10" fill="#c5e8e2"/><circle cx="65" cy="55" r="15" fill="#88c8bf"/><circle cx="110" cy="25" r="10" fill="#c5e8e2"/><circle cx="110" cy="85" r="10" fill="#c5e8e2"/><path d="M30 28l23 19m-23 35 23-19m27-15 20-18m-20 34 20 18"/></g><path d="M515 467 L584 467" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="607" y="459" fill="#205fa1" font-size="54" font-weight="750"><tspan x="607" dy="0">70%</tspan></text><text x="608" y="501" fill="#17384c" font-size="21" font-weight="500"><tspan x="608" dy="0">rain forecast</tspan></text><rect x="877" y="411" width="258" height="131" rx="16" fill="#fff" stroke="#b2d6cb" stroke-width="2"/><text x="898" y="461" fill="#086c68" font-size="23" font-weight="750"><tspan x="898" dy="0">Prediction,</tspan><tspan x="898" dy="32.199999999999996">not an action.</tspan></text><text x="62" y="620" fill="#17384c" font-size="23" font-weight="500"><tspan x="62" dy="0">Fit means adjust a model using examples. Using it to predict is a later step.</tspan><tspan x="62" dy="32.199999999999996">A 70% rain forecast is an estimate, not a promise that it will rain.</tspan></text></g></svg>