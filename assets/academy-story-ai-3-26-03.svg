<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">System evaluation sets — evidence trace</title><desc id="desc">System evaluation sets — evidence trace. Ten cases include six answerable and four missing-evidence cases. System answers five answerable correctly and abstains appropriately on three missing cases. | Record case ID, evidence version, expected claims or fallback, permitted actions and scoring rubric. Separate development from final cases. Aggregate metrics only after checking required conditions individually. | Answer correctness 5/6; appropriate fallback 3/4; combined contract passes 8/10 if each case has one required outcome. Different denominators answer different questions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/26 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">System evaluation sets — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Ten cases include six</tspan><tspan x="52.0" dy="32.66">answerable and four</tspan><tspan x="52.0" dy="32.66">missing-evidence cases.</tspan><tspan x="52.0" dy="32.66">System answers five</tspan><tspan x="52.0" dy="32.66">answerable correctly and</tspan><tspan x="52.0" dy="32.66">abstains appropriately on three</tspan><tspan x="52.0" dy="32.66">missing cases.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Record case ID, evidence</tspan><tspan x="426.6666666666667" dy="32.66">version, expected claims or</tspan><tspan x="426.6666666666667" dy="32.66">fallback, permitted actions and</tspan><tspan x="426.6666666666667" dy="32.66">scoring rubric. Separate</tspan><tspan x="426.6666666666667" dy="32.66">development from final cases.</tspan><tspan x="426.6666666666667" dy="32.66">Aggregate metrics only after</tspan><tspan x="426.6666666666667" dy="32.66">checking required conditions</tspan><tspan x="426.6666666666667" dy="32.66">individually.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Answer correctness 5/6;</tspan><tspan x="801.3333333333334" dy="32.66">appropriate fallback 3/4;</tspan><tspan x="801.3333333333334" dy="32.66">combined contract passes</tspan><tspan x="801.3333333333334" dy="32.66">8/10 if each case has one</tspan><tspan x="801.3333333333334" dy="32.66">required outcome. Different</tspan><tspan x="801.3333333333334" dy="32.66">denominators answer different</tspan><tspan x="801.3333333333334" dy="32.66">questions.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>