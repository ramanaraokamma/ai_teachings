<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="687" viewBox="0 0 1200 687" role="img" aria-labelledby="title desc"><title id="title">Predictive and Generative AI: the case</title><desc id="desc">A fictional learning tool first classifies a question, then drafts an answer from a supplied note. Supplied facts: A fitted classifier labels a question science; its training used labelled questions. Approved note N: evaporation changes liquid water into water vapour. A generator drafts: “Water evaporates into vapour and always disappears forever.”</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="687" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/1 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Predictive and Generative AI: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="25" r="8"/><circle cx="17" cy="70" r="8"/><circle cx="48" cy="47" r="10"/><circle cx="79" cy="25" r="8"/><circle cx="79" cy="70" r="8"/><path d="M24 30 L39 41 M24 65 L39 53 M57 41 L72 30 M57 53 L72 65"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">A fictional learning tool first classifies a</tspan><tspan x="63" dy="32.66">question, then drafts an answer from a</tspan><tspan x="63" dy="32.66">supplied note.</tspan></text><rect x="627" y="161" width="535" height="354" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">A fitted classifier labels a question science;</tspan><tspan x="652" dy="32.66">its training used labelled questions.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">Approved note N: evaporation changes</tspan><tspan x="652" dy="32.66">liquid water into water vapour. A generator</tspan><tspan x="652" dy="32.66">drafts: “Water evaporates into vapour and</tspan><tspan x="652" dy="32.66">always disappears forever.”</tspan></text><rect x="38" y="545" width="1124" height="113" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="578" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can identify generation and prediction objectives without confusing either with verified</tspan><tspan x="62" dy="32.66">truth.</tspan></text></g></svg>