<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="753" viewBox="0 0 1200 753" role="img" aria-labelledby="title desc"><title id="title">The session record changes — the model is not retrained</title><desc id="desc">The selected_book session state is Cedar after the first choice, Maple after correction, and unset after exit. This is an application record, not proof of permanent learning.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="753" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/20 · 03 · TRACK ONE PIECE OF MEMORY</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">The session record changes — the model is not retrained</tspan></text><rect x="38" y="161" width="1124" height="125" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(60 186) scale(0.7)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="166" y="198" fill="#205fa1" font-size="23" font-weight="750"><tspan x="166" dy="0">Choose a book</tspan></text><text x="166" y="244" fill="#17384c" font-size="22" font-weight="500"><tspan x="166" dy="0">Store the first selection.</tspan></text><rect x="920" y="183" width="215" height="75" rx="12" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="946" y="231" fill="#205fa1" font-size="29" font-weight="750"><tspan x="946" dy="0">Cedar</tspan></text><path d="M600 290 L600 312" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="316" width="1124" height="125" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(60 341) scale(0.7)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="166" y="353" fill="#6541a5" font-size="23" font-weight="750"><tspan x="166" dy="0">Correct the choice</tspan></text><text x="166" y="399" fill="#17384c" font-size="22" font-weight="500"><tspan x="166" dy="0">Replace Cedar; do not keep two active choices.</tspan></text><rect x="920" y="338" width="215" height="75" rx="12" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="946" y="386" fill="#6541a5" font-size="29" font-weight="750"><tspan x="946" dy="0">Maple</tspan></text><path d="M600 445 L600 467" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="471" width="1124" height="125" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(60 496) scale(0.7)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="35"/><path d="M47 21 V47 L65 59 M47 13 V18 M47 76 V81 M13 47 H18 M76 47 H81"/></g><text x="166" y="508" fill="#086c68" font-size="23" font-weight="750"><tspan x="166" dy="0">Exit the session</tspan></text><text x="166" y="554" fill="#17384c" font-size="22" font-weight="500"><tspan x="166" dy="0">Clear the record under this toy policy.</tspan></text><rect x="920" y="493" width="215" height="75" rx="12" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="946" y="541" fill="#086c68" font-size="29" font-weight="750"><tspan x="946" dy="0">Unset</tspan></text><text x="62" y="653" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">A new session needs a new selection. This record is not permanent model learning.</tspan></text></g></svg>