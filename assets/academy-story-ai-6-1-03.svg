<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Requirements and service boundaries — evidence trace</title><desc id="desc">Requirements and service boundaries — evidence trace. A request asks for Tuesday meeting time and to move it to Wednesday. The public schedule lists Tuesday 16:00. | The fictional student timetable service reads a public schedule and returns a meeting time or review status. It cannot edit schedules or email users. Test success and refusal before adding model behaviour. | Report Tuesday 16:00 from the schedule; refuse the edit because it is outside the service boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/1 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Requirements and service boundaries — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">A request asks for Tuesday</tspan><tspan x="52.0" dy="32.66">meeting time and to move it to</tspan><tspan x="52.0" dy="32.66">Wednesday. The public</tspan><tspan x="52.0" dy="32.66">schedule lists Tuesday 16:00.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">The fictional student timetable</tspan><tspan x="426.6666666666667" dy="32.66">service reads a public</tspan><tspan x="426.6666666666667" dy="32.66">schedule and returns a</tspan><tspan x="426.6666666666667" dy="32.66">meeting time or review status.</tspan><tspan x="426.6666666666667" dy="32.66">It cannot edit schedules or</tspan><tspan x="426.6666666666667" dy="32.66">email users. Test success and</tspan><tspan x="426.6666666666667" dy="32.66">refusal before adding model</tspan><tspan x="426.6666666666667" dy="32.66">behaviour.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Report Tuesday 16:00 from</tspan><tspan x="801.3333333333334" dy="32.66">the schedule; refuse the edit</tspan><tspan x="801.3333333333334" dy="32.66">because it is outside the</tspan><tspan x="801.3333333333334" dy="32.66">service boundary.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>