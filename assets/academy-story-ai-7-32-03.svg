<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Peer review and response — evidence trace</title><desc id="desc">Peer review and response — evidence trace. Reviewer asks for a fitted-line baseline; author responds that the neural network is advanced, without a comparison. | For each comment record concern, response, change location and new evidence if needed. If no new evidence exists, narrow the claim instead of promising an unperformed test. | The response lacks evidence. Add a fair comparison under the plan or narrow the claim to the existing baseline; record any new analysis as such.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/32 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Peer review and response — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Reviewer asks for a fitted-line</tspan><tspan x="52.0" dy="32.66">baseline; author responds that</tspan><tspan x="52.0" dy="32.66">the neural network is</tspan><tspan x="52.0" dy="32.66">advanced, without a</tspan><tspan x="52.0" dy="32.66">comparison.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For each comment record</tspan><tspan x="426.6666666666667" dy="32.66">concern, response, change</tspan><tspan x="426.6666666666667" dy="32.66">location and new evidence if</tspan><tspan x="426.6666666666667" dy="32.66">needed. If no new evidence</tspan><tspan x="426.6666666666667" dy="32.66">exists, narrow the claim</tspan><tspan x="426.6666666666667" dy="32.66">instead of promising an</tspan><tspan x="426.6666666666667" dy="32.66">unperformed test.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">The response lacks evidence.</tspan><tspan x="801.3333333333334" dy="32.66">Add a fair comparison under</tspan><tspan x="801.3333333333334" dy="32.66">the plan or narrow the claim to</tspan><tspan x="801.3333333333334" dy="32.66">the existing baseline; record</tspan><tspan x="801.3333333333334" dy="32.66">any new analysis as such.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>