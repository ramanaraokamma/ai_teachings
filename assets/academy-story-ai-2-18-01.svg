<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="621" viewBox="0 0 1200 621" role="img" aria-labelledby="title desc"><title id="title">Missing Data: the case</title><desc id="desc">A fictional catalogue records counts of available copies under a strict input contract. Supplied facts: Accept count only if type(value) is int and 0&lt;=value&lt;=8. Missing fields are invalid, and Booleans are not counts. Rows have count 0, count 4, absent count, count &quot;4&quot;, count True and count 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="621" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/18 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Missing Data: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">A fictional catalogue records counts of</tspan><tspan x="63" dy="32.66">available copies under a strict input</tspan><tspan x="63" dy="32.66">contract.</tspan></text><rect x="627" y="161" width="535" height="321" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Accept count only if type(value) is int and</tspan><tspan x="652" dy="32.66">0&lt;=value&lt;=8. Missing fields are invalid, and</tspan><tspan x="652" dy="32.66">Booleans are not counts.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">Rows have count 0, count 4, absent count,</tspan><tspan x="652" dy="32.66">count &quot;4&quot;, count True and count 9.</tspan></text><rect x="38" y="512" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="545" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can validate missing values without confusing zero with absent data.</tspan></text></g></svg>