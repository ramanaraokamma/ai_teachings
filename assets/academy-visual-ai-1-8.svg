<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1245" viewBox="0 0 1120 1245"><rect x="0" y="0" width="1120" height="1245" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-1/8</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Features: Useful Clues</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="12"/><path d="M25 25 Q6 47 25 69 M69 25 Q88 47 69 69 M34 34 Q23 47 34 60 M60 34 Q71 47 60 60"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Width check</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">P,Q,R,S have widths 6,7,6,6.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="574.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,527.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="12"/><path d="M25 25 Q6 47 25 69 M69 25 Q88 47 69 69 M34 34 Q23 47 34 60 M60 34 Q71 47 60 60"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Height check</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Their heights are 4,4,5,4.</text><path d="M560 656.7 V676.7 M550 668.7 L560 678.7 L570 668.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="686.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="686.7" width="10" height="150" rx="5" fill="#946528"/><circle cx="131" cy="761.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,714.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 10 V25 M47 25 L29 44 L47 63 L65 44 Z M29 44 H12 V79 M65 44 H82 V79"/><circle cx="12" cy="82" r="5"/><circle cx="82" cy="82" r="5"/></g><text x="216" y="729.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Apply both limits</text><text x="216" y="780.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">P and S fit; Q fails width; R fails height.</text><path d="M560 843.7 V863.7 M550 855.7 L560 865.7 L570 855.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="873.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="873.7" width="10" height="158" rx="5" fill="#7155a0"/><circle cx="131" cy="952.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,905.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="216" y="916.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Reject a shortcut</text><text x="216" y="967.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">The later sticker cannot be an input available before</text><text x="216" y="1008.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">checking.</text><rect x="52" y="1056.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1096.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1141.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Change Q&#x27;s width to 6 without changing its height.</text><text x="52" y="1197.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>