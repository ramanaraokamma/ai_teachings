<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Building a grounded answer — evidence trace</title><desc id="desc">Building a grounded answer — evidence trace. Current source P approves room C; Q lists C capacity 10. Draft says room C is approved, seats 10 and offers lunch. | Build a claim-evidence table before final wording. Preserve source versions and qualifiers, omit unsupported claims or explicitly state the gap, then validate the answer against the table. | Approval and capacity are supported by P and Q; lunch lacks evidence. A grounded answer reports the first two claims and does not invent lunch.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/18 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Building a grounded answer — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Current source P approves</tspan><tspan x="52.0" dy="32.66">room C; Q lists C capacity 10.</tspan><tspan x="52.0" dy="32.66">Draft says room C is approved,</tspan><tspan x="52.0" dy="32.66">seats 10 and offers lunch.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Build a claim-evidence table</tspan><tspan x="426.6666666666667" dy="32.66">before final wording. Preserve</tspan><tspan x="426.6666666666667" dy="32.66">source versions and qualifiers,</tspan><tspan x="426.6666666666667" dy="32.66">omit unsupported claims or</tspan><tspan x="426.6666666666667" dy="32.66">explicitly state the gap, then</tspan><tspan x="426.6666666666667" dy="32.66">validate the answer against the</tspan><tspan x="426.6666666666667" dy="32.66">table.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Approval and capacity are</tspan><tspan x="801.3333333333334" dy="32.66">supported by P and Q; lunch</tspan><tspan x="801.3333333333334" dy="32.66">lacks evidence. A grounded</tspan><tspan x="801.3333333333334" dy="32.66">answer reports the first two</tspan><tspan x="801.3333333333334" dy="32.66">claims and does not invent</tspan><tspan x="801.3333333333334" dy="32.66">lunch.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>