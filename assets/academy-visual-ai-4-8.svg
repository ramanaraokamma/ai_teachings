<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1066" viewBox="0 0 1120 1066"><rect x="0" y="0" width="1120" height="1066" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-4/8</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Leakage</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Group related views</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">All three Cedar views stay together; likewise Elm and Fir.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="158" rx="5" fill="#35699d"/><circle cx="131" cy="578.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,531.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Assign groups</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Training receives six views from Cedar/Elm; test receives</text><text x="216" y="634.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">three Fir views.</text><path d="M560 664.7 V684.7 M550 676.7 L560 686.7 L570 676.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="694.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="694.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="773.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,726.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="68" height="68" rx="12"/><path d="M27 47 L41 61 L69 31"/></g><text x="216" y="737.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. State claim</text><text x="216" y="788.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">The final test probes one unseen plant, not three</text><text x="216" y="829.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">independent plants.</text><rect x="52" y="877.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="917.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="962.8000000000001" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Move Fir&#x27;s first view into training while retaining its other two in test.</text><text x="52" y="1018.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>