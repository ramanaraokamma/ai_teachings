<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Proxy Features and Fairness: the case</title><desc id="desc">Removing an obvious setting field may leave another field that carries the same information. Supplied facts: Toy table has location=greenhouse/desk and camera_code=G/D. Every G record is greenhouse; every D record is desk. The team drops location. All inputs and outcomes in this worked example are invented classroom data; no real model run is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-4/32 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Proxy Features and Fairness: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Removing an obvious setting field may</tspan><tspan x="63" dy="32.66">leave another field that carries the same</tspan><tspan x="63" dy="32.66">information.</tspan></text><rect x="627" y="161" width="535" height="387" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Toy table has location=greenhouse/desk</tspan><tspan x="652" dy="32.66">and camera_code=G/D. Every G record is</tspan><tspan x="652" dy="32.66">greenhouse; every D record is desk. The</tspan><tspan x="652" dy="32.66">team drops location.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">All inputs and outcomes in this worked</tspan><tspan x="652" dy="32.66">example are invented classroom data; no</tspan><tspan x="652" dy="32.66">real model run is claimed.</tspan></text><rect x="38" y="578" width="1124" height="113" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="611" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can explain proxy features and fairness using a traced example and a stated</tspan><tspan x="62" dy="32.66">limitation.</tspan></text></g></svg>