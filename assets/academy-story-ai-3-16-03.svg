<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Claim support and citation evaluation — evidence trace</title><desc id="desc">Claim support and citation evaluation — evidence trace. An answer has four factual claims. Three have citations, but only two are supported by their cited passages. All links exist. | For this classroom rubric count a claim as supported only when its cited passage entails it. | Claim support is 2/4=50%; citation presence is 3/4=75%; link existence among three citations is 3/3. These measure different failures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/16 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Claim support and citation evaluation — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="193" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">An answer has four factual</tspan><tspan x="52.0" dy="32.66">claims. Three have citations,</tspan><tspan x="52.0" dy="32.66">but only two are supported by</tspan><tspan x="52.0" dy="32.66">their cited passages. All links</tspan><tspan x="52.0" dy="32.66">exist.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="193" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For this classroom rubric count</tspan><tspan x="426.6666666666667" dy="32.66">a claim as supported only</tspan><tspan x="426.6666666666667" dy="32.66">when its cited passage entails</tspan><tspan x="426.6666666666667" dy="32.66">it.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="193" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Claim support is 2/4=50%;</tspan><tspan x="801.3333333333334" dy="32.66">citation presence is 3/4=75%;</tspan><tspan x="801.3333333333334" dy="32.66">link existence among three</tspan><tspan x="801.3333333333334" dy="32.66">citations is 3/3. These</tspan><tspan x="801.3333333333334" dy="32.66">measure different failures.</tspan></text><text x="50" y="461" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>