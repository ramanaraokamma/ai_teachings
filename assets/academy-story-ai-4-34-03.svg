<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951" role="img" aria-labelledby="title desc"><title id="title">Four-step worked evidence for Week 34: Capstone Dataset and Baseline</title><desc id="desc">Four-step worked evidence for Week 34: Capstone Dataset and Baseline. 1 | Freeze dataset card v3 and grouped split s2 with no plant identity crossing sets.. 2 | Test set remains sealed; validation supports model choices.. 3 | Validation has 12 healthy and 8 spotted leaves. The always-healthy baseline scores 12/20=60% accuracy and 0/8=0% spotted recall. The rule has TP=5, FN=3, TN=10, FP=2: accuracy 75% and spotted recall 62.5%.. 4 | Acceptance requires valid citations, metric calculations, subgroup review, and safe escalation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="951" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-4/34 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Four-step worked evidence for Week 34: Capstone Dataset and</tspan><tspan x="38" dy="48.28">Baseline</tspan></text><rect x="38.0" y="209" width="556.0" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="240" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Step</tspan></text><rect x="600.0" y="209" width="556.0" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="614.0" y="240" fill="#086c68" font-size="21" font-weight="750"><tspan x="614.0" dy="0">Evidence and reasoning</tspan></text><rect x="38.0" y="277" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="308" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">1</tspan></text><rect x="600.0" y="277" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="308" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Freeze dataset card v3 and grouped split s2</tspan><tspan x="614.0" dy="32.66">with no plant identity crossing sets.</tspan></text><rect x="38.0" y="381" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="412" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">2</tspan></text><rect x="600.0" y="381" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="412" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Test set remains sealed; validation supports</tspan><tspan x="614.0" dy="32.66">model choices.</tspan></text><rect x="38.0" y="485" width="556.0" height="193" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="516" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">3</tspan></text><rect x="600.0" y="485" width="556.0" height="193" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="516" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Validation has 12 healthy and 8 spotted leaves.</tspan><tspan x="614.0" dy="32.66">The always-healthy baseline scores 12/20=60%</tspan><tspan x="614.0" dy="32.66">accuracy and 0/8=0% spotted recall. The rule</tspan><tspan x="614.0" dy="32.66">has TP=5, FN=3, TN=10, FP=2: accuracy 75%</tspan><tspan x="614.0" dy="32.66">and spotted recall 62.5%.</tspan></text><rect x="38.0" y="688" width="556.0" height="127" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="719" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">4</tspan></text><rect x="600.0" y="688" width="556.0" height="127" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="719" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Acceptance requires valid citations, metric</tspan><tspan x="614.0" dy="32.66">calculations, subgroup review, and safe</tspan><tspan x="614.0" dy="32.66">escalation.</tspan></text><text x="50" y="854" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Trace these corrected steps. Keep the stated metric, assumptions and interpretation when you change</tspan><tspan x="50" dy="31.24">the case.</tspan></text></g></svg>