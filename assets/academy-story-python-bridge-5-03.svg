<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="828" viewBox="0 0 1200 828" role="img" aria-labelledby="title desc"><title id="title">Check invalid values before the size rule</title><desc id="desc">First ask count less than zero: yes selects invalid. Otherwise ask count less than five: yes selects small; no selects large. Separate input traces are minus two invalid, four small, five large.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="828" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / PYTHON-BRIDGE/5 · 03 · FOLLOW THE FIRST MATCHING BRANCH</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Check invalid values before the size rule</tspan></text><path d="M600 178L805 243L600 308L395 243Z" fill="#eee8f7" stroke="#6541a5" stroke-width="3"/><text x="513" y="251" fill="#6541a5" font-size="25" font-weight="750"><tspan x="513" dy="0">count &lt; 0 ?</tspan></text><path d="M600 366L805 431L600 496L395 431Z" fill="#eee8f7" stroke="#6541a5" stroke-width="3"/><text x="513" y="439" fill="#6541a5" font-size="25" font-weight="750"><tspan x="513" dy="0">count &lt; 5 ?</tspan></text><path d="M390 243 L240 243" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="281" y="227" fill="#17384c" font-size="20" font-weight="500"><tspan x="281" dy="0">yes</tspan></text><rect x="38" y="204" width="195" height="78" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="64" y="252" fill="#975014" font-size="28" font-weight="750"><tspan x="64" dy="0">invalid</tspan></text><path d="M600 313 L600 360" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="620" y="341" fill="#17384c" font-size="20" font-weight="500"><tspan x="620" dy="0">no</tspan></text><path d="M390 431 L240 431" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="281" y="413" fill="#17384c" font-size="20" font-weight="500"><tspan x="281" dy="0">yes</tspan></text><rect x="38" y="392" width="195" height="78" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="64" y="440" fill="#086c68" font-size="28" font-weight="750"><tspan x="64" dy="0">small</tspan></text><path d="M810 431 L962 431" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="862" y="412" fill="#17384c" font-size="20" font-weight="500"><tspan x="862" dy="0">no</tspan></text><rect x="970" y="392" width="192" height="78" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="994" y="440" fill="#205fa1" font-size="28" font-weight="750"><tspan x="994" dy="0">large</tspan></text><rect x="38" y="551" width="1124" height="148" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="591" fill="#086c68" font-size="24" font-weight="750"><tspan x="62" dy="0">Trace separate inputs through the same procedure:</tspan></text><text x="62" y="642" fill="#17384c" font-size="29" font-weight="500"><tspan x="62" dy="0">−2 → invalid   |   4 → small   |   5 → large</tspan></text><text x="62" y="738" fill="#17384c" font-size="23" font-weight="500"><tspan x="62" dy="0">A chosen branch ends the chain. Equality with 5 reaches the “large” branch.</tspan></text></g></svg>