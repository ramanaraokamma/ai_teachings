<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">Two pixel badges: equal counts, different arrangements</title><desc id="desc">Using 1 for black and 0 for white, Badge A has top row 1 0 1 and bottom row 0 1 0. Badge B has top row 1 1 1 and bottom row 0 0 0. Each has three black pixels. The top-middle and bottom-middle pixels differ.</desc><rect width="1400" height="880" rx="32" fill="#f3f8fb"/><g font-family="Arial, sans-serif" fill="#17384e"><text x="60" y="65" font-size="19" font-weight="700" fill="#286d77">AI ACADEMY / LEVEL 1 · WEEK 5</text><text x="60" y="121" font-size="38" font-weight="700">Same black-pixel count. Different positions.</text><text x="60" y="166" font-size="23">Two rows × three columns · top row first · left to right · 1 = black, 0 = white</text><rect x="65" y="205" width="610" height="475" rx="24" fill="white" stroke="#b9d2df" stroke-width="2"/><text x="95" y="256" font-size="30" font-weight="700">Badge A</text><text x="265" y="308" text-anchor="middle" font-size="20" fill="#405b6a">Left</text><text x="388" y="308" text-anchor="middle" font-size="20" fill="#405b6a">Middle</text><text x="511" y="308" text-anchor="middle" font-size="20" fill="#405b6a">Right</text><text x="91" y="394" font-size="21" font-weight="700">Top</text><rect x="208" y="329" width="112" height="112" rx="8" fill="#17384e" stroke="#17384e" stroke-width="3"/><text x="264" y="400" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><rect x="331" y="329" width="112" height="112" rx="8" fill="#fff" stroke="#17384e" stroke-width="3"/><text x="387" y="400" text-anchor="middle" font-size="40" font-weight="700" fill="#17384e">0</text><rect x="454" y="329" width="112" height="112" rx="8" fill="#17384e" stroke="#17384e" stroke-width="3"/><text x="510" y="400" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><text x="91" y="517" font-size="21" font-weight="700">Bottom</text><rect x="208" y="452" width="112" height="112" rx="8" fill="#fff" stroke="#17384e" stroke-width="3"/><text x="264" y="523" text-anchor="middle" font-size="40" font-weight="700" fill="#17384e">0</text><rect x="331" y="452" width="112" height="112" rx="8" fill="#17384e" stroke="#17384e" stroke-width="3"/><text x="387" y="523" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><rect x="454" y="452" width="112" height="112" rx="8" fill="#fff" stroke="#17384e" stroke-width="3"/><text x="510" y="523" text-anchor="middle" font-size="40" font-weight="700" fill="#17384e">0</text><text x="95" y="637" font-size="26" font-weight="700" fill="#167069">Black pixels = 3 out of 6</text><rect x="725" y="205" width="610" height="475" rx="24" fill="white" stroke="#b9d2df" stroke-width="2"/><text x="755" y="256" font-size="30" font-weight="700">Badge B</text><text x="925" y="308" text-anchor="middle" font-size="20" fill="#405b6a">Left</text><text x="1048" y="308" text-anchor="middle" font-size="20" fill="#405b6a">Middle</text><text x="1171" y="308" text-anchor="middle" font-size="20" fill="#405b6a">Right</text><text x="751" y="394" font-size="21" font-weight="700">Top</text><rect x="868" y="329" width="112" height="112" rx="8" fill="#17384e" stroke="#17384e" stroke-width="3"/><text x="924" y="400" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><rect x="991" y="329" width="112" height="112" rx="8" fill="#17384e" stroke="#17384e" stroke-width="3"/><text x="1047" y="400" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><rect x="1114" y="329" width="112" height="112" rx="8" fill="#17384e" stroke="#17384e" stroke-width="3"/><text x="1170" y="400" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><text x="751" y="517" font-size="21" font-weight="700">Bottom</text><rect x="868" y="452" width="112" height="112" rx="8" fill="#fff" stroke="#17384e" stroke-width="3"/><text x="924" y="523" text-anchor="middle" font-size="40" font-weight="700" fill="#17384e">0</text><rect x="991" y="452" width="112" height="112" rx="8" fill="#fff" stroke="#17384e" stroke-width="3"/><text x="1047" y="523" text-anchor="middle" font-size="40" font-weight="700" fill="#17384e">0</text><rect x="1114" y="452" width="112" height="112" rx="8" fill="#fff" stroke="#17384e" stroke-width="3"/><text x="1170" y="523" text-anchor="middle" font-size="40" font-weight="700" fill="#17384e">0</text><text x="755" y="637" font-size="26" font-weight="700" fill="#167069">Black pixels = 3 out of 6</text><rect x="65" y="718" width="1270" height="112" rx="18" fill="#e5f2ef"/><text x="95" y="762" font-size="26" font-weight="700">Compare the middle column.</text><text x="95" y="802" font-size="24">A is white above black. B is black above white. Counting alone loses those positions.</text></g></svg>