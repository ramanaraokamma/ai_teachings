<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Representation and bias evaluation — evidence trace</title><desc id="desc">Representation and bias evaluation — evidence trace. A grounded assistant supports 9 of 10 group-A cases and 6 of 10 group-B cases. | Define the task, relevant groups, labels and denominators before comparing. Use fictional, non-identifying records. Evaluate quality and fallback outcomes separately; preserve sample sizes and unresolved explanations. | Rates 90% and 60%; gap 30 percentage points. Investigate case mix, retrieval coverage and annotation rules before attributing cause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/30 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Representation and bias evaluation — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">A grounded assistant supports</tspan><tspan x="52.0" dy="32.66">9 of 10 group-A cases and 6 of</tspan><tspan x="52.0" dy="32.66">10 group-B cases.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Define the task, relevant</tspan><tspan x="426.6666666666667" dy="32.66">groups, labels and</tspan><tspan x="426.6666666666667" dy="32.66">denominators before</tspan><tspan x="426.6666666666667" dy="32.66">comparing. Use fictional,</tspan><tspan x="426.6666666666667" dy="32.66">non-identifying records.</tspan><tspan x="426.6666666666667" dy="32.66">Evaluate quality and fallback</tspan><tspan x="426.6666666666667" dy="32.66">outcomes separately; preserve</tspan><tspan x="426.6666666666667" dy="32.66">sample sizes and unresolved</tspan><tspan x="426.6666666666667" dy="32.66">explanations.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Rates 90% and 60%; gap 30</tspan><tspan x="801.3333333333334" dy="32.66">percentage points. Investigate</tspan><tspan x="801.3333333333334" dy="32.66">case mix, retrieval coverage</tspan><tspan x="801.3333333333334" dy="32.66">and annotation rules before</tspan><tspan x="801.3333333333334" dy="32.66">attributing cause.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>