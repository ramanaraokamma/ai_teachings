<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">External side effects and recovery — evidence trace</title><desc id="desc">External side effects and recovery — evidence trace. A booking is committed in storage, but response delivery times out. Caller asks to repeat. | The mock ledger records prepared, committed or unknown per operation ID. Retry a committed operation by returning its result; reconcile unknown status instead of assuming failure. Preserve compensation as a separate authorised action. | Lookup the operation ID and return the committed booking; do not create a second booking. A lost acknowledgement does not undo the effect.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/17 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">External side effects and recovery — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">A booking is committed in</tspan><tspan x="52.0" dy="32.66">storage, but response delivery</tspan><tspan x="52.0" dy="32.66">times out. Caller asks to</tspan><tspan x="52.0" dy="32.66">repeat.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">The mock ledger records</tspan><tspan x="426.6666666666667" dy="32.66">prepared, committed or</tspan><tspan x="426.6666666666667" dy="32.66">unknown per operation ID.</tspan><tspan x="426.6666666666667" dy="32.66">Retry a committed operation</tspan><tspan x="426.6666666666667" dy="32.66">by returning its result;</tspan><tspan x="426.6666666666667" dy="32.66">reconcile unknown status</tspan><tspan x="426.6666666666667" dy="32.66">instead of assuming failure.</tspan><tspan x="426.6666666666667" dy="32.66">Preserve compensation as a</tspan><tspan x="426.6666666666667" dy="32.66">separate authorised action.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Lookup the operation ID and</tspan><tspan x="801.3333333333334" dy="32.66">return the committed booking;</tspan><tspan x="801.3333333333334" dy="32.66">do not create a second</tspan><tspan x="801.3333333333334" dy="32.66">booking. A lost</tspan><tspan x="801.3333333333334" dy="32.66">acknowledgement does not</tspan><tspan x="801.3333333333334" dy="32.66">undo the effect.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>