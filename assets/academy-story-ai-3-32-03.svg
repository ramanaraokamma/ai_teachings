<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Human review and consequential use — evidence trace</title><desc id="desc">Human review and consequential use — evidence trace. Coordinator approves draft v1 for room B. Assistant changes room to C in v2 and submits using the old approval. | For this fictional workflow the assistant drafts a room request but only the coordinator can approve and submit it. Review packets include sources, uncertainty, requested action and the exact version. Any material change requires new approval. | The submission violates version-bound approval. Preserve v1 approval, request review of v2 and prevent submission until its exact action is approved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/32 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Human review and consequential use — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Coordinator approves draft v1</tspan><tspan x="52.0" dy="32.66">for room B. Assistant changes</tspan><tspan x="52.0" dy="32.66">room to C in v2 and submits</tspan><tspan x="52.0" dy="32.66">using the old approval.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For this fictional workflow the</tspan><tspan x="426.6666666666667" dy="32.66">assistant drafts a room request</tspan><tspan x="426.6666666666667" dy="32.66">but only the coordinator can</tspan><tspan x="426.6666666666667" dy="32.66">approve and submit it. Review</tspan><tspan x="426.6666666666667" dy="32.66">packets include sources,</tspan><tspan x="426.6666666666667" dy="32.66">uncertainty, requested action</tspan><tspan x="426.6666666666667" dy="32.66">and the exact version. Any</tspan><tspan x="426.6666666666667" dy="32.66">material change requires new</tspan><tspan x="426.6666666666667" dy="32.66">approval.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">The submission violates</tspan><tspan x="801.3333333333334" dy="32.66">version-bound approval.</tspan><tspan x="801.3333333333334" dy="32.66">Preserve v1 approval, request</tspan><tspan x="801.3333333333334" dy="32.66">review of v2 and prevent</tspan><tspan x="801.3333333333334" dy="32.66">submission until its exact</tspan><tspan x="801.3333333333334" dy="32.66">action is approved.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>