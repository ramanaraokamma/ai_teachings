<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc"><title id="title">Follow the deciding steps</title><desc id="desc">Reference population: 20 labelled cases, including four repair-needed books. → Baseline: 16/20=80% accuracy; catches 0/4 needed cases. → Candidate: (3+14)/20=85% accuracy; catches 3/4=75% needed cases. → Compare costs: Candidate also raises two false alarms; discuss both missed repairs and extra checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="910" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/12 · 02 · TRACE THE CASE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Follow the deciding steps</tspan></text><rect x="38" y="161" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 195) scale(0.9)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="203" y="199" fill="#205fa1" font-size="26" font-weight="750"><tspan x="203" dy="0">01  Reference population</tspan></text><text x="204" y="243" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">20 labelled cases, including four repair-needed books.</tspan></text><path d="M600 306 L600 331" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="341" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 375) scale(0.9)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="203" y="379" fill="#6541a5" font-size="26" font-weight="750"><tspan x="203" dy="0">02  Baseline</tspan></text><text x="204" y="423" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">16/20=80% accuracy; catches 0/4 needed cases.</tspan></text><path d="M600 486 L600 511" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="521" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 555) scale(0.9)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="203" y="559" fill="#086c68" font-size="26" font-weight="750"><tspan x="203" dy="0">03  Candidate</tspan></text><text x="204" y="603" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">(3+14)/20=85% accuracy; catches 3/4=75% needed cases.</tspan></text><path d="M600 666 L600 691" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="701" width="1124" height="174" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 735) scale(0.9)" fill="none" stroke="#975014" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="203" y="739" fill="#975014" font-size="26" font-weight="750"><tspan x="203" dy="0">04  Compare costs</tspan></text><text x="204" y="783" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Candidate also raises two false alarms; discuss both missed repairs and extra</tspan><tspan x="204" dy="34.08">checks.</tspan></text></g></svg>