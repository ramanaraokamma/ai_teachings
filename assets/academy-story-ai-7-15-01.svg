<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Multiple comparisons: the case</title><desc id="desc">Six declared prompt comparisons. A team performs six valid hypothesis tests and applies a predeclared Bonferroni familywise threshold. Supplied facts: Familywise alpha=0.05. Supplied unadjusted p-values are 0.004,0.012,0.02,0.08,0.4,0.9. These values are stipulated, not calculated from invented data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/15 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Multiple comparisons: the case</tspan></text><rect x="38" y="161" width="535" height="256" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 10 V25 M47 25 L29 44 L47 63 L65 44 Z M29 44 H12 V79 M65 44 H82 V79"/><circle cx="12" cy="82" r="5"/><circle cx="82" cy="82" r="5"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Six declared prompt comparisons. A team</tspan><tspan x="63" dy="32.66">performs six valid hypothesis tests and</tspan><tspan x="63" dy="32.66">applies a predeclared Bonferroni familywise</tspan><tspan x="63" dy="32.66">threshold.</tspan></text><rect x="627" y="161" width="535" height="289" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Familywise alpha=0.05. Supplied</tspan><tspan x="652" dy="32.66">unadjusted p-values are</tspan><tspan x="652" dy="32.66">0.004,0.012,0.02,0.08,0.4,0.9. These values</tspan><tspan x="652" dy="32.66">are stipulated, not calculated from invented</tspan><tspan x="652" dy="32.66">data.</tspan></text><rect x="38" y="480" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="513" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">Explain multiple comparisons using the records and boundaries of this fictional investigation.</tspan></text></g></svg>