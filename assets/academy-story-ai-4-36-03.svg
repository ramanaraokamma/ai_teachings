<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Machine learning project defense at a glance</title><desc id="desc">Machine learning project defense at a glance. Show the process | Task data splits versions | Explain one prediction. Show the evidence | Baseline metrics errors | Trace one reported number. Show the limits | Unsupported uses next step | Answer peer questions</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-4/36 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Machine learning project defense at a glance</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Part</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Evidence or action</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Interpretation</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Show the process</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Task data splits versions</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Explain one prediction</tspan></text><rect x="38.0" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Show the evidence</tspan></text><rect x="412.6666666666667" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Baseline metrics errors</tspan></text><rect x="787.3333333333334" y="300" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="331" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Trace one reported number</tspan></text><rect x="38.0" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Show the limits</tspan></text><rect x="412.6666666666667" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Unsupported uses next step</tspan></text><rect x="787.3333333333334" y="371" width="368.6666666666667" height="61" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Answer peer questions</tspan></text><text x="50" y="471" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Prepare a five-minute presentation with a one-page evidence summary and linked project files. Include</tspan><tspan x="50" dy="31.24">the data dictionary, split record, run record, prediction ledger, model card and revision history.</tspan><tspan x="50" dy="31.24">Demonstrate one prediction or arithmetic calculation live so the audience can follow the reasoning.</tspan></text></g></svg>