<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1106" viewBox="0 0 1120 1106"><rect x="0" y="0" width="1120" height="1106" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-3/26</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Evaluation Sets</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="158" rx="5" fill="#147d87"/><circle cx="131" cy="391.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,344.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Separate cases</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Keep answerable and missing-evidence cases as different</text><text x="216" y="447.4" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">groups.</text><path d="M560 477.7 V497.7 M550 489.7 L560 499.7 L570 489.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="507.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="507.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="582.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,535.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="216" y="550.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Calculate rates</text><text x="216" y="601.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Answering: 2/3. Appropriate uncertainty: 3/3.</text><path d="M560 664.7 V684.7 M550 676.7 L560 686.7 L570 676.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="694.7" width="1016" height="198" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="694.7" width="10" height="198" rx="5" fill="#946528"/><circle cx="131" cy="793.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,746.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="17" width="43" height="61" rx="7"/><path d="M10 47 H62 M48 33 L62 47 L48 61"/></g><text x="216" y="737.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Report total</text><text x="216" y="788.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Five of six pass overall; the perfect missing-evidence</text><text x="216" y="829.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">group hides one answering failure if only totals are</text><text x="216" y="869.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">discussed.</text><rect x="52" y="917.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="957.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1002.8000000000001" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Add three missing-evidence cases that all pass.</text><text x="52" y="1058.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>