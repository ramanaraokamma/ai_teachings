<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Connect the explanation to its limit</title><desc id="desc">Eligibility and ranking answer different questions. C has a high preference score but is not an animal book, so it must stay excluded. The implementation needs a no-match result and explicit tie policy even when this example has a unique winner. Save rejected reasons for an explanation, not just the final ID. Limit: Toy preference weights do not imply shorter or illustrated books are universally better for all learners.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/33 · 05 · EXPLAIN WITH CARE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Connect the explanation to its limit</tspan></text><rect x="38" y="161" width="535" height="387" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="68" height="68" rx="12"/><path d="M27 47 L41 61 L69 31"/></g><text x="148" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="148" dy="0">What the case explains</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Eligibility and ranking answer different</tspan><tspan x="63" dy="32.66">questions. C has a high preference score</tspan><tspan x="63" dy="32.66">but is not an animal book, so it must stay</tspan><tspan x="63" dy="32.66">excluded. The implementation needs a</tspan><tspan x="63" dy="32.66">no-match result and explicit tie policy even</tspan><tspan x="63" dy="32.66">when this example has a unique winner.</tspan><tspan x="63" dy="32.66">Save rejected reasons for an explanation,</tspan><tspan x="63" dy="32.66">not just the final ID.</tspan></text><rect x="627" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#975014" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="737" y="201" fill="#975014" font-size="24" font-weight="750"><tspan x="737" dy="0">What it does not establish</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Toy preference weights do not imply shorter</tspan><tspan x="652" dy="32.66">or illustrated books are universally better for</tspan><tspan x="652" dy="32.66">all learners.</tspan></text></g></svg>