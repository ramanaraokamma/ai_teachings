<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="876" viewBox="0 0 1200 876" role="img" aria-labelledby="title desc"><title id="title">Follow the deciding steps</title><desc id="desc">Same shelf: Place both devices together and allow them to settle. → Paired readings: Record three matching times: (40,45), (50,55), (60,65). → Compare gaps: B minus A is 5, 5 and 5 units. → Check a reference: A trusted reference is needed to decide which reading is closer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="876" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-1/3 · 02 · TRACE THE CASE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Follow the deciding steps</tspan></text><rect x="38" y="161" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 195) scale(0.9)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="12"/><path d="M25 25 Q6 47 25 69 M69 25 Q88 47 69 69 M34 34 Q23 47 34 60 M60 34 Q71 47 60 60"/></g><text x="203" y="199" fill="#205fa1" font-size="26" font-weight="750"><tspan x="203" dy="0">01  Same shelf</tspan></text><text x="204" y="243" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Place both devices together and allow them to settle.</tspan></text><path d="M600 306 L600 331" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="341" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 375) scale(0.9)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="203" y="379" fill="#6541a5" font-size="26" font-weight="750"><tspan x="203" dy="0">02  Paired readings</tspan></text><text x="204" y="423" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Record three matching times: (40,45), (50,55), (60,65).</tspan></text><path d="M600 486 L600 511" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="521" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 555) scale(0.9)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="203" y="559" fill="#086c68" font-size="26" font-weight="750"><tspan x="203" dy="0">03  Compare gaps</tspan></text><text x="204" y="603" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">B minus A is 5, 5 and 5 units.</tspan></text><path d="M600 666 L600 691" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="701" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 735) scale(0.9)" fill="none" stroke="#975014" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="68" height="68" rx="12"/><path d="M27 47 L41 61 L69 31"/></g><text x="203" y="739" fill="#975014" font-size="26" font-weight="750"><tspan x="203" dy="0">04  Check a reference</tspan></text><text x="204" y="783" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">A trusted reference is needed to decide which reading is closer.</tspan></text></g></svg>