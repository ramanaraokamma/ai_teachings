<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Deployment environments: the case</title><desc id="desc">Separate rehearsal and live service. Staging rehearses a new answer version with fictional records; production serves approved school records. Supplied facts: Staging card names trial room Z; production card names room A. Credentials and stores are separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/23 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Deployment environments: the case</tspan></text><rect x="38" y="161" width="535" height="256" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12 H46 M29 12 V44 L12 77 Q9 83 17 84 H54 Q62 83 59 77 L42 44 V12 M19 64 H52 M65 20 H83 M68 20 V68 Q75 88 80 68 V20 M69 55 H79"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Separate rehearsal and live service. Staging</tspan><tspan x="63" dy="32.66">rehearses a new answer version with</tspan><tspan x="63" dy="32.66">fictional records; production serves</tspan><tspan x="63" dy="32.66">approved school records.</tspan></text><rect x="627" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(6