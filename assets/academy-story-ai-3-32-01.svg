<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="687" viewBox="0 0 1200 687" role="img" aria-labelledby="title desc"><title id="title">Human AI Workflow: the case</title><desc id="desc">A human approval belongs to the exact draft and action reviewed. Supplied facts: A teacher approves study handout H1 for classroom printing. H2 adds a pupil email address and proposes public posting. No H2 approval exists. All inputs and outcomes in this worked example are invented classroom data; no real model run is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="687" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/32 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Human AI Workflow: the case</tspan></text><rect x="38" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">A human approval belongs to the exact draft</tspan><tspan x="63" dy="32.66">and action reviewed.</tspan></text><rect x="627" y="161" width="535" height="387" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">A teacher approves study handout H1 for</tspan><tspan x="652" dy="32.66">classroom printing. H2 adds a pupil email</tspan><tspan x="652" dy="32.66">address and proposes public posting. No H2</tspan><tspan x="652" dy="32.66">approval exists.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">All inputs and outcomes in this worked</tspan><tspan x="652" dy="32.66">example are invented classroom data; no</tspan><tspan x="652" dy="32.66">real model run is claimed.</tspan></text><rect x="38" y="578" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="611" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can explain human ai workflow using a traced example and a stated limitation.</tspan></text></g></svg>