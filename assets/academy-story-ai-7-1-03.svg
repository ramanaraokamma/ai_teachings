<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">A question that evidence can answer — evidence trace</title><desc id="desc">A question that evidence can answer — evidence trace. Proposal says prove AI is useful; available records are retrieval results for five room queries. | For fictional classroom retrieval, ask whether method B returns more relevant records than lexical baseline A on a reserved judged query set at cutoff 3. Define eligible corpus and relevance rules before running. | Narrow to relevant retrieval at a declared cutoff on those queries. The supplied records cannot answer universal usefulness or deployment impact.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/1 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">A question that evidence can answer — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Proposal says prove AI is</tspan><tspan x="52.0" dy="32.66">useful; available records are</tspan><tspan x="52.0" dy="32.66">retrieval results for five room</tspan><tspan x="52.0" dy="32.66">queries.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For fictional classroom</tspan><tspan x="426.6666666666667" dy="32.66">retrieval, ask whether method</tspan><tspan x="426.6666666666667" dy="32.66">B returns more relevant</tspan><tspan x="426.6666666666667" dy="32.66">records than lexical baseline A</tspan><tspan x="426.6666666666667" dy="32.66">on a reserved judged query set</tspan><tspan x="426.6666666666667" dy="32.66">at cutoff 3. Define eligible</tspan><tspan x="426.6666666666667" dy="32.66">corpus and relevance rules</tspan><tspan x="426.6666666666667" dy="32.66">before running.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Narrow to relevant retrieval at</tspan><tspan x="801.3333333333334" dy="32.66">a declared cutoff on those</tspan><tspan x="801.3333333333334" dy="32.66">queries. The supplied records</tspan><tspan x="801.3333333333334" dy="32.66">cannot answer universal</tspan><tspan x="801.3333333333334" dy="32.66">usefulness or deployment</tspan><tspan x="801.3333333333334" dy="32.66">impact.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>