<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Configuration and secrets — evidence trace</title><desc id="desc">Configuration and secrets — evidence trace. A startup script prints every environment variable while debugging a missing data version. | The toy service reads DATA_VERSION from configuration and a signing secret from server-only input. Validate required settings at startup and fail clearly if absent; do not substitute a published default secret. | It risks exposing secrets unrelated to the error. Report the missing key name without values and validate only required fields.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/4 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Configuration and secrets — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">A startup script prints every</tspan><tspan x="52.0" dy="32.66">environment variable while</tspan><tspan x="52.0" dy="32.66">debugging a missing data</tspan><tspan x="52.0" dy="32.66">version.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">The toy service reads</tspan><tspan x="426.6666666666667" dy="32.66">DATA_VERSION from</tspan><tspan x="426.6666666666667" dy="32.66">configuration and a signing</tspan><tspan x="426.6666666666667" dy="32.66">secret from server-only input.</tspan><tspan x="426.6666666666667" dy="32.66">Validate required settings at</tspan><tspan x="426.6666666666667" dy="32.66">startup and fail clearly if</tspan><tspan x="426.6666666666667" dy="32.66">absent; do not substitute a</tspan><tspan x="426.6666666666667" dy="32.66">published default secret.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">It risks exposing secrets</tspan><tspan x="801.3333333333334" dy="32.66">unrelated to the error. Report</tspan><tspan x="801.3333333333334" dy="32.66">the missing key name without</tspan><tspan x="801.3333333333334" dy="32.66">values and validate only</tspan><tspan x="801.3333333333334" dy="32.66">required fields.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>