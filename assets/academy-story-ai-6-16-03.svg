<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="754" viewBox="0 0 1200 754" role="img" aria-labelledby="title desc"><title id="title">Timeouts retries and cancellation — evidence trace</title><desc id="desc">Timeouts retries and cancellation — evidence trace. Three attempts each time out after 4 seconds with gaps 1 and 2. A fourth is proposed. | Retry only declared transient failures. Use at most three attempts with waiting gaps 1 and 2 seconds; the caller waits at most 4 seconds for each attempt under the enforced local timeout model. Worst-case elapsed bound excluding overhead is 3*4+1+2=15 seconds. | Budget is exhausted after 15 seconds under the model; reject fourth attempt. A late side-effect result must still be reconciled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="754" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/16 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Timeouts retries and cancellation — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="358" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Three attempts each time out</tspan><tspan x="52.0" dy="32.66">after 4 seconds with gaps 1</tspan><tspan x="52.0" dy="32.66">and 2. A fourth is proposed.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="358" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Retry only declared transient</tspan><tspan x="426.6666666666667" dy="32.66">failures. Use at most three</tspan><tspan x="426.6666666666667" dy="32.66">attempts with waiting gaps 1</tspan><tspan x="426.6666666666667" dy="32.66">and 2 seconds; the caller waits</tspan><tspan x="426.6666666666667" dy="32.66">at most 4 seconds for each</tspan><tspan x="426.6666666666667" dy="32.66">attempt under the enforced</tspan><tspan x="426.6666666666667" dy="32.66">local timeout model.</tspan><tspan x="426.6666666666667" dy="32.66">Worst-case elapsed bound</tspan><tspan x="426.6666666666667" dy="32.66">excluding overhead is</tspan><tspan x="426.6666666666667" dy="32.66">3*4+1+2=15 seconds.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="358" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Budget is exhausted after 15</tspan><tspan x="801.3333333333334" dy="32.66">seconds under the model;</tspan><tspan x="801.3333333333334" dy="32.66">reject fourth attempt. A late</tspan><tspan x="801.3333333333334" dy="32.66">side-effect result must still be</tspan><tspan x="801.3333333333334" dy="32.66">reconciled.</tspan></text><text x="50" y="626" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>