<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Writing the methods section — evidence trace</title><desc id="desc">Writing the methods section — evidence trace. Methods says used AI on data and got good scores; code and split are absent. | Report question, units, sampling, permissions, data roles, baseline, procedure, metrics, uncertainty assumptions, missing/exclusion handling and versions. Distinguish prespecified and later changes. | It omits model/procedure version, data identity, units/splits, baseline, metric and scoring. Reproduction and validity cannot be assessed from the description.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/30 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Writing the methods section — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Methods says used AI on data</tspan><tspan x="52.0" dy="32.66">and got good scores; code and</tspan><tspan x="52.0" dy="32.66">split are absent.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Report question, units,</tspan><tspan x="426.6666666666667" dy="32.66">sampling, permissions, data</tspan><tspan x="426.6666666666667" dy="32.66">roles, baseline, procedure,</tspan><tspan x="426.6666666666667" dy="32.66">metrics, uncertainty</tspan><tspan x="426.6666666666667" dy="32.66">assumptions,</tspan><tspan x="426.6666666666667" dy="32.66">missing/exclusion handling</tspan><tspan x="426.6666666666667" dy="32.66">and versions. Distinguish</tspan><tspan x="426.6666666666667" dy="32.66">prespecified and later</tspan><tspan x="426.6666666666667" dy="32.66">changes.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">It omits model/procedure</tspan><tspan x="801.3333333333334" dy="32.66">version, data identity,</tspan><tspan x="801.3333333333334" dy="32.66">units/splits, baseline, metric</tspan><tspan x="801.3333333333334" dy="32.66">and scoring. Reproduction and</tspan><tspan x="801.3333333333334" dy="32.66">validity cannot be assessed</tspan><tspan x="801.3333333333334" dy="32.66">from the description.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>