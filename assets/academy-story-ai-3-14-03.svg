<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Generation failures and verification — evidence trace</title><desc id="desc">Generation failures and verification — evidence trace. Source R says room B seats 12 and the meeting starts at 15:00. Generated answer says B seats 20, starts at 15:00 and includes free lunch. | Split an answer into atomic claims. For each, record the exact source passage, support status and any needed calculation. Mark unsupported and contradicted claims separately; do not repair them by inventing sources. | Capacity 20 is contradicted; 15:00 is supported; free lunch is unsupported. One of three claims has support. The missing lunch fact is not evidence of no lunch.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/14 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Generation failures and verification — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Source R says room B seats</tspan><tspan x="52.0" dy="32.66">12 and the meeting starts at</tspan><tspan x="52.0" dy="32.66">15:00. Generated answer says</tspan><tspan x="52.0" dy="32.66">B seats 20, starts at 15:00 and</tspan><tspan x="52.0" dy="32.66">includes free lunch.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Split an answer into atomic</tspan><tspan x="426.6666666666667" dy="32.66">claims. For each, record the</tspan><tspan x="426.6666666666667" dy="32.66">exact source passage, support</tspan><tspan x="426.6666666666667" dy="32.66">status and any needed</tspan><tspan x="426.6666666666667" dy="32.66">calculation. Mark unsupported</tspan><tspan x="426.6666666666667" dy="32.66">and contradicted claims</tspan><tspan x="426.6666666666667" dy="32.66">separately; do not repair them</tspan><tspan x="426.6666666666667" dy="32.66">by inventing sources.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Capacity 20 is contradicted;</tspan><tspan x="801.3333333333334" dy="32.66">15:00 is supported; free lunch</tspan><tspan x="801.3333333333334" dy="32.66">is unsupported. One of three</tspan><tspan x="801.3333333333334" dy="32.66">claims has support. The</tspan><tspan x="801.3333333333334" dy="32.66">missing lunch fact is not</tspan><tspan x="801.3333333333334" dy="32.66">evidence of no lunch.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>