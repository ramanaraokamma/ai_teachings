<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Incident investigation: the case</title><desc id="desc">An incident timeline. After a schedule update, a service gives an old classroom location. Supplied facts: 14:00 version 6 publishes room D; 14:05 answer uses version 5 room C; 14:06 user reports mismatch.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/26 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Incident investigation: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="35"/><path d="M47 21 V47 L65 59 M47 13 V18 M47 76 V81 M13 47 H18 M76 47 H81"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">An incident timeline. After a schedule</tspan><tspan x="63" dy="32.66">update, a service gives an old classroom</tspan><tspan x="63" dy="32.66">location.</tspan></text><rect x="627" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M