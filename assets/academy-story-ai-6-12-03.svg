<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="622" viewBox="0 0 1200 622" role="img" aria-labelledby="title desc"><title id="title">Logs traces and privacy — evidence trace</title><desc id="desc">Logs traces and privacy — evidence trace. A failure record includes trace R7, status=denied and the complete student passcode. | For this policy log trace ID, stage, status, duration and error category; do not log passcodes, student text or teacher answers. Restrict access and declare retention. | Trace/status are useful; passcode violates the logging policy. Redact sensitive content and retain a non-sensitive error category.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="622" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/12 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Logs traces and privacy — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">A failure record includes trace</tspan><tspan x="52.0" dy="32.66">R7, status=denied and the</tspan><tspan x="52.0" dy="32.66">complete student passcode.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For this policy log trace ID,</tspan><tspan x="426.6666666666667" dy="32.66">stage, status, duration and</tspan><tspan x="426.6666666666667" dy="32.66">error category; do not log</tspan><tspan x="426.6666666666667" dy="32.66">passcodes, student text or</tspan><tspan x="426.6666666666667" dy="32.66">teacher answers. Restrict</tspan><tspan x="426.6666666666667" dy="32.66">access and declare retention.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Trace/status are useful;</tspan><tspan x="801.3333333333334" dy="32.66">passcode violates the logging</tspan><tspan x="801.3333333333334" dy="32.66">policy. Redact sensitive</tspan><tspan x="801.3333333333334" dy="32.66">content and retain a</tspan><tspan x="801.3333333333334" dy="32.66">non-sensitive error category.</tspan></text><text x="50" y="494" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>