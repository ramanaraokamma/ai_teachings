<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="622" viewBox="0 0 1200 622" role="img" aria-labelledby="title desc"><title id="title">Release and rollback — evidence trace</title><desc id="desc">Release and rollback — evidence trace. After deployment v2 creates schema 2 records; operator proposes rollback code alone to v1. | Version v2 writes schema 2. Version v1 reads only schema 1. A rollback to v1 after v2 writes data cannot safely proceed without migration or a compatible reader. | Code-only rollback is incompatible with stored schema 2. Use the tested recovery plan or compatible migration; preserve data and failure evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="622" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/24 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Release and rollback — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">After deployment v2 creates</tspan><tspan x="52.0" dy="32.66">schema 2 records; operator</tspan><tspan x="52.0" dy="32.66">proposes rollback code alone</tspan><tspan x="52.0" dy="32.66">to v1.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Version v2 writes schema 2.</tspan><tspan x="426.6666666666667" dy="32.66">Version v1 reads only schema</tspan><tspan x="426.6666666666667" dy="32.66">1. A rollback to v1 after v2</tspan><tspan x="426.6666666666667" dy="32.66">writes data cannot safely</tspan><tspan x="426.6666666666667" dy="32.66">proceed without migration or a</tspan><tspan x="426.6666666666667" dy="32.66">compatible reader.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Code-only rollback is</tspan><tspan x="801.3333333333334" dy="32.66">incompatible with stored</tspan><tspan x="801.3333333333334" dy="32.66">schema 2. Use the tested</tspan><tspan x="801.3333333333334" dy="32.66">recovery plan or compatible</tspan><tspan x="801.3333333333334" dy="32.66">migration; preserve data and</tspan><tspan x="801.3333333333334" dy="32.66">failure evidence.</tspan></text><text x="50" y="494" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>