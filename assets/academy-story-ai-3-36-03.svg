<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Generative systems defense — evidence trace</title><desc id="desc">Generative systems defense — evidence trace. System reports 9/10 retrieved relevant records, 7/10 supported answers and zero actions in a read-only run. | Link each claim to a recorded result. State the distinction between retrieval relevance, claim support, fallback and permissions. Give a reproduction packet and answer challenges without inventing missing measurements. | Retrieval rate 90% and support rate 70% differ. Action trace supports zero actions in that run; no timing evidence supports speed. Correct the full-correctness and speed claims.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/36 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Generative systems defense — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">System reports 9/10 retrieved</tspan><tspan x="52.0" dy="32.66">relevant records, 7/10</tspan><tspan x="52.0" dy="32.66">supported answers and zero</tspan><tspan x="52.0" dy="32.66">actions in a read-only run.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Link each claim to a recorded</tspan><tspan x="426.6666666666667" dy="32.66">result. State the distinction</tspan><tspan x="426.6666666666667" dy="32.66">between retrieval relevance,</tspan><tspan x="426.6666666666667" dy="32.66">claim support, fallback and</tspan><tspan x="426.6666666666667" dy="32.66">permissions. Give a</tspan><tspan x="426.6666666666667" dy="32.66">reproduction packet and</tspan><tspan x="426.6666666666667" dy="32.66">answer challenges without</tspan><tspan x="426.6666666666667" dy="32.66">inventing missing</tspan><tspan x="426.6666666666667" dy="32.66">measurements.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Retrieval rate 90% and support</tspan><tspan x="801.3333333333334" dy="32.66">rate 70% differ. Action trace</tspan><tspan x="801.3333333333334" dy="32.66">supports zero actions in that</tspan><tspan x="801.3333333333334" dy="32.66">run; no timing evidence</tspan><tspan x="801.3333333333334" dy="32.66">supports speed. Correct the</tspan><tspan x="801.3333333333334" dy="32.66">full-correctness and speed</tspan><tspan x="801.3333333333334" dy="32.66">claims.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>