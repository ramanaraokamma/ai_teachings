<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1261" viewBox="0 0 1120 1261"><rect x="0" y="0" width="1120" height="1261" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-1/28</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Humans Set Boundaries</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="158" rx="5" fill="#147d87"/><circle cx="131" cy="391.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,344.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Read authority</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">The teacher approved P2, one internal noticeboard and</text><text x="216" y="447.4" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">one publication.</text><path d="M560 477.7 V497.7 M550 489.7 L560 499.7 L570 489.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="507.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="507.7" width="10" height="158" rx="5" fill="#35699d"/><circle cx="131" cy="586.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,539.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="216" y="550.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Allowed action</text><text x="216" y="601.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Publishing unchanged P2 there today matches the</text><text x="216" y="642.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">approval.</text><path d="M560 672.7 V692.7 M550 684.7 L560 694.7 L570 684.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="702.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="702.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="781.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,734.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="36"/><path d="M31 33 Q34 17 51 22 Q72 30 56 45 Q47 51 47 60"/><circle cx="47" cy="72" r="2"/></g><text x="216" y="745.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Changed version</text><text x="216" y="796.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">P3 requires new review; P2 approval does not</text><text x="216" y="837.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">automatically cover edits.</text><path d="M560 867.7 V887.7 M550 879.7 L560 889.7 L570 879.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="897.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="897.7" width="10" height="150" rx="5" fill="#7155a0"/><circle cx="131" cy="972.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,925.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="216" y="940.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Changed audience</text><text x="216" y="991.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Public-web publication exceeds the approved destination.</text><rect x="52" y="1072.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1112.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1157.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">P2 has already been published once under this approval.</text><text x="52" y="1213.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>