<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1200 705" role="img" aria-labelledby="title desc"><title id="title">Weighted brightness score</title><desc id="desc">Weighted brightness score. Inputs: [2, 5]; weights: [3, -1]; bias: 0; activation: identity; output: 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="705" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(60 16) scale(0.9642857142857143)"><rect width="1120" height="657" rx="25" fill="#f5f9fc"/><text x="52" y="54" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-5/2</text><text x="52" y="106" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#123c55">Weighted brightness score</text><rect x="52" y="192.3" width="1016" height="82" rx="15" fill="#e1eff4"/><text x="78" y="245.3" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#146b77">Input 2  x  weight 3  =  6</text><rect x="52" y="297.3" width="1016" height="82" rx="15" fill="#e1eff4"/><text x="78" y="350.3" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#146b77">Input 5  x  weight -1  =  -5</text><text x="52" y="417.3" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Add the products and bias 0: total = 1</text><rect x="52" y="477.8" width="1016" height="105" rx="18" fill="#fff3df"/><text x="78" y="539.8" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#875b22">Keep the total (identity)  -&gt;  output 1</text></g></g></svg>