<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="876" viewBox="0 0 1200 876" role="img" aria-labelledby="title desc"><title id="title">Follow the deciding steps</title><desc id="desc">Observe: Input 6 produced 12; that fact fits two explanations. → Predict alternatives: For input 2, adding 6 predicts 8; doubling predicts 4. → Run revealing test: The fictional new record is input 2 → output 8. → Locate cause: This record supports add-6 over doubling for this comparison.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="876" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-1/12 · 02 · TRACE THE CASE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Follow the deciding steps</tspan></text><rect x="38" y="161" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 195) scale(0.9)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="203" y="199" fill="#205fa1" font-size="26" font-weight="750"><tspan x="203" dy="0">01  Observe</tspan></text><text x="204" y="243" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Input 6 produced 12; that fact fits two explanations.</tspan></text><path d="M600 306 L600 331" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="341" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 375) scale(0.9)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="36"/><path d="M31 33 Q34 17 51 22 Q72 30 56 45 Q47 51 47 60"/><circle cx="47" cy="72" r="2"/></g><text x="203" y="379" fill="#6541a5" font-size="26" font-weight="750"><tspan x="203" dy="0">02  Predict alternatives</tspan></text><text x="204" y="423" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">For input 2, adding 6 predicts 8; doubling predicts 4.</tspan></text><path d="M600 486 L600 511" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="521" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 555) scale(0.9)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12 H46 M29 12 V44 L12 77 Q9 83 17 84 H54 Q62 83 59 77 L42 44 V12 M19 64 H52 M65 20 H83 M68 20 V68 Q75 88 80 68 V20 M69 55 H79"/></g><text x="203" y="559" fill="#086c68" font-size="26" font-weight="750"><tspan x="203" dy="0">03  Run revealing test</tspan></text><text x="204" y="603" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">The fictional new record is input 2 → output 8.</tspan></text><path d="M600 666 L600 691" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="701" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 735) scale(0.9)" fill="none" stroke="#975014" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="68" height="68" rx="12"/><path d="M27 47 L41 61 L69 31"/></g><text x="203" y="739" fill="#975014" font-size="26" font-weight="750"><tspan x="203" dy="0">04  Locate cause</tspan></text><text x="204" y="783" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">This record supports add-6 over doubling for this comparison.</tspan></text></g></svg>