<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1058" viewBox="0 0 1120 1058"><rect x="0" y="0" width="1120" height="1058" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-5/5</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Composing layers</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="20" r="7"/><circle cx="15" cy="73" r="7"/><circle cx="47" cy="20" r="7"/><circle cx="47" cy="47" r="7"/><circle cx="47" cy="73" r="7"/><circle cx="79" cy="47" r="8"/><path d="M22 20 H40 M22 20 L40 47 M22 20 L40 73 M22 73 L40 20 M22 73 L40 47 M22 73 H40 M54 20 L71 42 M54 47 H71 M54 73 L71 52"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. First hidden unit</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">u-2=2, so h1=2.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="574.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,527.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="20" r="7"/><circle cx="15" cy="73" r="7"/><circle cx="47" cy="20" r="7"/><circle cx="47" cy="47" r="7"/><circle cx="47" cy="73" r="7"/><circle cx="79" cy="47" r="8"/><path d="M22 20 H40 M22 20 L40 47 M22 20 L40 73 M22 73 L40 20 M22 73 L40 47 M22 73 H40 M54 20 L71 42 M54 47 H71 M54 73 L71 52"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Second hidden unit</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">v-1=2, so h2=2.</text><path d="M560 656.7 V676.7 M550 668.7 L560 678.7 L570 668.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="686.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="686.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="765.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,718.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="17" width="43" height="61" rx="7"/><path d="M10 47 H62 M48 33 L62 47 L48 61"/></g><text x="216" y="729.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Compose output</text><text x="216" y="780.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">y=2-2=0; the output uses activated hidden values, not raw</text><text x="216" y="821.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">inputs.</text><rect x="52" y="869.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="909.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="954.8000000000001" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Change only v from 3 to1.</text><text x="52" y="1010.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>