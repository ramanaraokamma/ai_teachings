<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc"><title id="title">Change one thing. Trace what follows.</title><desc id="desc">Original case: After done, another search requires a separately defined new run. Changed condition: Replace the edge checking→done with checking→review and review→done, without updating Trace A. Expected result: Trace A becomes invalid at checking→done under the revised table. Reason: A required new transition changes what constitutes a complete run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="665" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-2/30 · 04 · COMPARE THE CASES</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Change one thing. Trace what follows.</tspan></text><rect x="38" y="161" width="535" height="220" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="35"/><path d="M47 21 V47 L65 59 M47 13 V18 M47 76 V81 M13 47 H18 M76 47 H81"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">Original case</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">After done, another search requires a</tspan><tspan x="63" dy="32.66">separately defined new run.</tspan></text><rect x="627" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12 H46 M29 12 V44 L12 77 Q9 83 17 84 H54 Q62 83 59 77 L42 44 V12 M19 64 H52 M65 20 H83 M68 20 V68 Q75 88 80 68 V20 M69 55 H79"/></g><text x="737" y="201" fill="#6541a5" font-size="24" font-weight="750"><tspan x="737" dy="0">Changed condition</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Replace the edge checking→done with</tspan><tspan x="652" dy="32.66">checking→review and review→done,</tspan><tspan x="652" dy="32.66">without updating Trace A.</tspan></text><rect x="38" y="412" width="1124" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 429) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="17" width="43" height="61" rx="7"/><path d="M10 47 H62 M48 33 L62 47 L48 61"/></g><text x="148" y="452" fill="#086c68" font-size="24" font-weight="750"><tspan x="148" dy="0">Worked changed-case result</tspan></text><text x="63" y="512" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Trace A becomes invalid at checking→done under the revised table.</tspan><tspan x="63" dy="32.66"></tspan><tspan x="63" dy="32.66">Why: A required new transition changes what constitutes a complete run.</tspan></text></g></svg>