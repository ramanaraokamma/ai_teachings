<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title desc"><title id="title">Follow the deciding steps</title><desc id="desc">Name evidence: Record v = 3, 20 photo cases, 5 plant identities, group-separated split and indoor tablet conditions. → Compare baseline: v = 3 accuracy 80%; baseline70% on the same 20 cases. → State limits: Do not claim all cameras, outdoor conditions or disease diagnosis were validated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="764" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-4/33 · 02 · TRACE THE CASE</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Follow the deciding steps</tspan></text><rect x="38" y="161" width="1124" height="174" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 195) scale(0.9)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 Q31 12 46 21 Q64 12 82 19 V74 Q64 66 46 77 Q30 66 12 74 Z"/><path d="M46 21 V77 M21 31 L36 34 M56 33 L73 30 M21 43 L36 46 M56 45 L73 42"/></g><text x="203" y="199" fill="#205fa1" font-size="26" font-weight="750"><tspan x="203" dy="0">01  Name evidence</tspan></text><text x="204" y="243" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Record v = 3, 20 photo cases, 5 plant identities, group-separated split and</tspan><tspan x="204" dy="34.08">indoor tablet conditions.</tspan></text><path d="M600 340 L600 365" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="375" width="1124" height="140" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 409) scale(0.9)" fill="none" stroke="#6541a5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="203" y="413" fill="#6541a5" font-size="26" font-weight="750"><tspan x="203" dy="0">02  Compare baseline</tspan></text><text x="204" y="457" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">v = 3 accuracy 80%; baseline70% on the same 20 cases.</tspan></text><path d="M600 520 L600 545" stroke="#7892a4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="555" width="1124" height="174" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(62 589) scale(0.9)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 9 L81 22 V46 Q79 72 47 86 Q15 72 13 46 V22 Z"/><rect x="33" y="39" width="28" height="24" rx="3"/><path d="M38 39 V31 Q47 17 56 31 V39"/></g><text x="203" y="593" fill="#086c68" font-size="26" font-weight="750"><tspan x="203" dy="0">03  State limits</tspan></text><text x="204" y="637" fill="#17384c" font-size="24" font-weight="500"><tspan x="204" dy="0">Do not claim all cameras, outdoor conditions or disease diagnosis were</tspan><tspan x="204" dy="34.08">validated.</tspan></text></g></svg>