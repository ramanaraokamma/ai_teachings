<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1245" viewBox="0 0 1120 1245"><rect x="0" y="0" width="1120" height="1245" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-1/10</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">If/Then Decisions</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Update first</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Starts 3,4,5 become 5,6,7.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="574.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,527.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 10 V25 M47 25 L29 44 L47 63 L65 44 Z M29 44 H12 V79 M65 44 H82 V79"/><circle cx="12" cy="82" r="5"/><circle cx="82" cy="82" r="5"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Test current value</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">5&gt;=6 is false; 6&gt;=6 and 7&gt;=6 are true.</text><path d="M560 656.7 V676.7 M550 668.7 L560 678.7 L570 668.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="686.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="686.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="765.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,718.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M31 20 L9 47 L31 74 M63 20 L85 47 L63 74 M55 14 L39 80"/></g><text x="216" y="729.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Choose one branch</text><text x="216" y="780.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Double 5 to 10; subtract 1 from 6 to 5; subtract 1 from 7 to</text><text x="216" y="821.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">6.</text><path d="M560 851.7 V871.7 M550 863.7 L560 873.7 L570 863.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="881.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="881.7" width="10" height="150" rx="5" fill="#7155a0"/><circle cx="131" cy="956.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,909.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="17" width="43" height="61" rx="7"/><path d="M10 47 H62 M48 33 L62 47 L48 61"/></g><text x="216" y="924.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Report</text><text x="216" y="975.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">The three independent runs report 10,5,6.</text><rect x="52" y="1056.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1096.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1141.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Replace at least 6 with above 6.</text><text x="52" y="1197.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>