<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" rx="24" fill="#f3f8fb"/><text x="32" y="45" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">THE EXACT BOUNDARY REVEALS THE BUG</text><text x="32" y="83" font-family="Arial,sans-serif" font-size="21" fill="#17384c" font-weight="500">Compare each expression separately for the same supplied integer.</text><text x="420" y="135" font-family="Arial,sans-serif" font-size="25" fill="#17384c" font-weight="700">x = 2</text><text x="620" y="135" font-family="Arial,sans-serif" font-size="25" fill="#17384c" font-weight="700">x = 3</text><text x="820" y="135" font-family="Arial,sans-serif" font-size="25" fill="#17384c" font-weight="700">x = 4</text><text x="608" y="166" font-family="Arial,sans-serif" font-size="18" fill="#8a3b12" font-weight="700">boundary</text><text x="35" y="233" font-family="Arial,sans-serif" font-size="25" fill="#17384c" font-weight="700">Intended: x &lt; 3</text><rect x="390" y="185" width="175" height="75" rx="12" fill="#dfedea" stroke="#6b8a97" stroke-width="1"/><text x="435" y="232" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">True</text><rect x="590" y="185" width="175" height="75" rx="12" fill="#fff0ce" stroke="#a35118" stroke-width="3"/><text x="635" y="232" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">False</text><rect x="790" y="185" width="175" height="75" rx="12" fill="#dfedea" stroke="#6b8a97" stroke-width="1"/><text x="835" y="232" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">False</text><text x="35" y="328" font-family="Arial,sans-serif" font-size="25" fill="#17384c" font-weight="700">Bug: x &lt;= 3</text><rect x="390" y="280" width="175" height="75" rx="12" fill="#dfedea" stroke="#6b8a97" stroke-width="1"/><text x="435" y="327" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">True</text><rect x="590" y="280" width="175" height="75" rx="12" fill="#fff0ce" stroke="#a35118" stroke-width="3"/><text x="635" y="327" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">True</text><rect x="790" y="280" width="175" height="75" rx="12" fill="#dfedea" stroke="#6b8a97" stroke-width="1"/><text x="835" y="327" font-family="Arial,sans-serif" font-size="28" fill="#17384c" font-weight="700">False</text><text x="32" y="405" font-family="Arial,sans-serif" font-size="21" fill="#17384c" font-weight="500">Only x = 3 distinguishes these versions. Tests at 2 and 4 both miss the bug.</text><text x="32" y="447" font-family="Arial,sans-serif" font-size="21" fill="#17384c" font-weight="500">A failing assertion stops its run; later assertions are not evaluated.</text><text x="32" y="480" font-family="Arial,sans-serif" font-size="19" fill="#17384c" font-weight="500">The table compares expressions, rather than claiming all checks ran after failure.</text></svg>