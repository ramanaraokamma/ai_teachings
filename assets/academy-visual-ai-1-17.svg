<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1245" viewBox="0 0 1120 1245"><rect x="0" y="0" width="1120" height="1245" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-1/17</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Prediction Is Not Fact</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="12"/><path d="M25 25 Q6 47 25 69 M69 25 Q88 47 69 69 M34 34 Q23 47 34 60 M60 34 Q71 47 60 60"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Prediction input</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">T has moisture score 4.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="574.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,527.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="25" r="8"/><circle cx="17" cy="70" r="8"/><circle cx="48" cy="47" r="10"/><circle cx="79" cy="25" r="8"/><circle cx="79" cy="70" r="8"/><path d="M24 30 L39 41 M24 65 L39 53 M57 41 L72 30 M57 53 L72 65"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Predict</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">4 is below 5, so D predicts quick.</text><path d="M560 656.7 V676.7 M550 668.7 L560 678.7 L570 668.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="686.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="686.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="765.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,718.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="35"/><path d="M47 21 V47 L65 59 M47 13 V18 M47 76 V81 M13 47 H18 M76 47 H81"/></g><text x="216" y="729.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Observe later</text><text x="216" y="780.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Measured time is 9 minutes; above 8 means observed</text><text x="216" y="821.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">slow.</text><path d="M560 851.7 V871.7 M550 863.7 L560 873.7 L570 863.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="881.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="881.7" width="10" height="150" rx="5" fill="#7155a0"/><circle cx="131" cy="956.7" r="54" fill="#7155a0" opacity=".10"/><g transform="translate(84,909.7)" fill="none" stroke="#7155a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="68" height="68" rx="12"/><path d="M27 47 L41 61 L69 31"/></g><text x="216" y="924.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#7155a0">4. Compare evidence</text><text x="216" y="975.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Prediction quick disagrees with observation slow.</text><rect x="52" y="1056.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="1096.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="1141.8" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">Keep score 4 but measure exactly 8 minutes.</text><text x="52" y="1197.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>