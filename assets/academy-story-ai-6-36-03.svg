<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Engineering demonstration and defense — evidence trace</title><desc id="desc">Engineering demonstration and defense — evidence trace. Demo succeeds on three cases using mocked storage. Presenter claims real network reliability and production security. | Present requirements, architecture, contracts, permissions, evaluation, resource measurements and recovery. Show one supported case, one legitimate review and one denied operation. State what was mocked and what remains untested. | The demo supports the three fixture behaviours only. Real availability, resource limits and broader security remain untested; preserve the mock boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="721" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/36 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Engineering demonstration and defense — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Demo succeeds on three</tspan><tspan x="52.0" dy="32.66">cases using mocked storage.</tspan><tspan x="52.0" dy="32.66">Presenter claims real network</tspan><tspan x="52.0" dy="32.66">reliability and production</tspan><tspan x="52.0" dy="32.66">security.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Present requirements,</tspan><tspan x="426.6666666666667" dy="32.66">architecture, contracts,</tspan><tspan x="426.6666666666667" dy="32.66">permissions, evaluation,</tspan><tspan x="426.6666666666667" dy="32.66">resource measurements and</tspan><tspan x="426.6666666666667" dy="32.66">recovery. Show one supported</tspan><tspan x="426.6666666666667" dy="32.66">case, one legitimate review</tspan><tspan x="426.6666666666667" dy="32.66">and one denied operation.</tspan><tspan x="426.6666666666667" dy="32.66">State what was mocked and</tspan><tspan x="426.6666666666667" dy="32.66">what remains untested.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="325" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">The demo supports the three</tspan><tspan x="801.3333333333334" dy="32.66">fixture behaviours only. Real</tspan><tspan x="801.3333333333334" dy="32.66">availability, resource limits and</tspan><tspan x="801.3333333333334" dy="32.66">broader security remain</tspan><tspan x="801.3333333333334" dy="32.66">untested; preserve the mock</tspan><tspan x="801.3333333333334" dy="32.66">boundary.</tspan></text><text x="50" y="593" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>