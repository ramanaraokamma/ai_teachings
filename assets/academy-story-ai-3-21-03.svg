<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Tools and API contracts — evidence trace</title><desc id="desc">Tools and API contracts — evidence trace. Proposed call lookup_room has room_id=B and extra argument book=true. | For lookup_room accept exactly room_id as a nonempty string; return found plus capacity or a not-found result. It is read-only. Reject unknown arguments and do not replace missing values with invented facts. | Reject the extra field under the closed input contract. The lookup tool provides no booking authority even if the requested room exists.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/21 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Tools and API contracts — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Proposed call lookup_room</tspan><tspan x="52.0" dy="32.66">has room_id=B and extra</tspan><tspan x="52.0" dy="32.66">argument book=true.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For lookup_room accept</tspan><tspan x="426.6666666666667" dy="32.66">exactly room_id as a</tspan><tspan x="426.6666666666667" dy="32.66">nonempty string; return found</tspan><tspan x="426.6666666666667" dy="32.66">plus capacity or a not-found</tspan><tspan x="426.6666666666667" dy="32.66">result. It is read-only. Reject</tspan><tspan x="426.6666666666667" dy="32.66">unknown arguments and do</tspan><tspan x="426.6666666666667" dy="32.66">not replace missing values</tspan><tspan x="426.6666666666667" dy="32.66">with invented facts.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Reject the extra field under the</tspan><tspan x="801.3333333333334" dy="32.66">closed input contract. The</tspan><tspan x="801.3333333333334" dy="32.66">lookup tool provides no</tspan><tspan x="801.3333333333334" dy="32.66">booking authority even if the</tspan><tspan x="801.3333333333334" dy="32.66">requested room exists.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>