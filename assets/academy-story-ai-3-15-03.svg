<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Conflicting and time-sensitive sources — evidence trace</title><desc id="desc">Conflicting and time-sensitive sources — evidence trace. Notice N says room A from Monday. Signed amendment M references N and changes to B effective Wednesday. Query asks Tuesday, then Thursday. | For this toy task a signed amendment supersedes the referenced original from its effective time. Keep both records. A newer timestamp alone has no authority unless the policy grants it. | Tuesday uses A; Thursday uses B. The amendment effective time, not merely upload order, determines the change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/15 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Conflicting and time-sensitive sources — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Notice N says room A from</tspan><tspan x="52.0" dy="32.66">Monday. Signed amendment</tspan><tspan x="52.0" dy="32.66">M references N and changes</tspan><tspan x="52.0" dy="32.66">to B effective Wednesday.</tspan><tspan x="52.0" dy="32.66">Query asks Tuesday, then</tspan><tspan x="52.0" dy="32.66">Thursday.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For this toy task a signed</tspan><tspan x="426.6666666666667" dy="32.66">amendment supersedes the</tspan><tspan x="426.6666666666667" dy="32.66">referenced original from its</tspan><tspan x="426.6666666666667" dy="32.66">effective time. Keep both</tspan><tspan x="426.6666666666667" dy="32.66">records. A newer timestamp</tspan><tspan x="426.6666666666667" dy="32.66">alone has no authority unless</tspan><tspan x="426.6666666666667" dy="32.66">the policy grants it.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Tuesday uses A; Thursday</tspan><tspan x="801.3333333333334" dy="32.66">uses B. The amendment</tspan><tspan x="801.3333333333334" dy="32.66">effective time, not merely</tspan><tspan x="801.3333333333334" dy="32.66">upload order, determines the</tspan><tspan x="801.3333333333334" dy="32.66">change.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>