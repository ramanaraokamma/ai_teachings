<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Capstone failure testing — evidence trace</title><desc id="desc">Capstone failure testing — evidence trace. Four cases: malformed request, student teacher-guide request, missing register, valid current record. One rejects invalid input, one denies access, one reviews and one supports; no restricted reads occur. | Use a failure matrix linking condition to expected response and forbidden calls. Test both visible result and operation trace. Preserve failed fixtures for regression checks. | All four meet their expected condition if responses and traces agree. Denial/review are successful contract outcomes, not automatic test failures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/34 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Capstone failure testing — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Four cases: malformed</tspan><tspan x="52.0" dy="32.66">request, student teacher-guide</tspan><tspan x="52.0" dy="32.66">request, missing register, valid</tspan><tspan x="52.0" dy="32.66">current record. One rejects</tspan><tspan x="52.0" dy="32.66">invalid input, one denies</tspan><tspan x="52.0" dy="32.66">access, one reviews and one</tspan><tspan x="52.0" dy="32.66">supports; no restricted reads</tspan><tspan x="52.0" dy="32.66">occur.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Use a failure matrix linking</tspan><tspan x="426.6666666666667" dy="32.66">condition to expected</tspan><tspan x="426.6666666666667" dy="32.66">response and forbidden calls.</tspan><tspan x="426.6666666666667" dy="32.66">Test both visible result and</tspan><tspan x="426.6666666666667" dy="32.66">operation trace. Preserve</tspan><tspan x="426.6666666666667" dy="32.66">failed fixtures for regression</tspan><tspan x="426.6666666666667" dy="32.66">checks.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">All four meet their expected</tspan><tspan x="801.3333333333334" dy="32.66">condition if responses and</tspan><tspan x="801.3333333333334" dy="32.66">traces agree. Denial/review</tspan><tspan x="801.3333333333334" dy="32.66">are successful contract</tspan><tspan x="801.3333333333334" dy="32.66">outcomes, not automatic test</tspan><tspan x="801.3333333333334" dy="32.66">failures.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>