<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="title desc"><title id="title">Embeddings and neighbourhoods: the case</title><desc id="desc">Measure embedding neighbours without turning numerical proximity into factual certainty. Supplied facts: Toy table P =[0, 1], Q=[3, 1], R=[1, 4]; query [1, 1]. Use squared Euclidean distance. All inputs and outcomes in this worked example are invented classroom data; no real model run is claimed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="654" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-5/26 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Embeddings and neighbourhoods: the case</tspan></text><rect x="38" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13 V81 H85 M25 76 V57 H39 V76 M45 76 V37 H59 V76 M65 76 V20 H79 V76"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Measure embedding neighbours without</tspan><tspan x="63" dy="32.66">turning numerical proximity into factual</tspan><tspan x="63" dy="32.66">certainty.</tspan></text><rect x="627" y="161" width="535" height="321" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">Toy table P =[0, 1], Q=[3, 1], R=[1, 4]; query</tspan><tspan x="652" dy="32.66">[1, 1]. Use squared Euclidean distance.</tspan><tspan x="652" dy="32.66"></tspan><tspan x="652" dy="32.66">All inputs and outcomes in this worked</tspan><tspan x="652" dy="32.66">example are invented classroom data; no</tspan><tspan x="652" dy="32.66">real model run is claimed.</tspan></text><rect x="38" y="512" width="1124" height="113" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="545" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">By the end, I can explain embeddings and neighbourhoods using a traced example and a stated</tspan><tspan x="62" dy="32.66">limitation.</tspan></text></g></svg>