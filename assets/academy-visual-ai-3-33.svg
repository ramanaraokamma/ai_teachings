<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1058" viewBox="0 0 1120 1058"><rect x="0" y="0" width="1120" height="1058" rx="28" fill="#edf5f8"/><text x="52" y="57" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#356b7b">AI ACADEMY  /  AI-3/33</text><text x="52" y="104.7" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#123c55">Capstone Design</text><rect x="52" y="174.7" width="1016" height="100" rx="18" fill="#ffffff" stroke="#c4dbe5"/><text x="76" y="210.7" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#146b77">Start with the supplied facts</text><text x="76" y="247.7" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#183249">Follow each arrow. Ask which fact allows the next step.</text><rect x="52" y="312.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="312.7" width="10" height="150" rx="5" fill="#147d87"/><circle cx="131" cy="387.7" r="54" fill="#147d87" opacity=".10"/><g transform="translate(84,340.7)" fill="none" stroke="#147d87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M47 10 V25 M47 25 L29 44 L47 63 L65 44 Z M29 44 H12 V79 M65 44 H82 V79"/><circle cx="12" cy="82" r="5"/><circle cx="82" cy="82" r="5"/></g><text x="216" y="355.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#147d87">1. Define contract</text><text x="216" y="406.9" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">Answer only glossary-definition requests supported by V1.</text><path d="M560 469.7 V489.7 M550 481.7 L560 491.7 L570 481.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="499.7" width="1016" height="150" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="499.7" width="10" height="150" rx="5" fill="#35699d"/><circle cx="131" cy="574.7" r="54" fill="#35699d" opacity=".10"/><g transform="translate(84,527.7)" fill="none" stroke="#35699d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 Q31 12 46 21 Q64 12 82 19 V74 Q64 66 46 77 Q30 66 12 74 Z"/><path d="M46 21 V77 M21 31 L36 34 M56 33 L73 30 M21 43 L36 46 M56 45 L73 42"/></g><text x="216" y="542.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#35699d">2. Plan normal test</text><text x="216" y="593.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">&quot;What is a stem?&quot; must point to V1&#x27;s stem entry.</text><path d="M560 656.7 V676.7 M550 668.7 L560 678.7 L570 668.7" fill="none" stroke="#638796" stroke-width="4" stroke-linecap="round"/><rect x="52" y="686.7" width="1016" height="158" rx="20" fill="#ffffff" stroke="#bed5df" stroke-width="2"/><rect x="52" y="686.7" width="10" height="158" rx="5" fill="#946528"/><circle cx="131" cy="765.7" r="54" fill="#946528" opacity=".10"/><g transform="translate(84,718.7)" fill="none" stroke="#946528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="47" r="36"/><path d="M31 33 Q34 17 51 22 Q72 30 56 45 Q47 51 47 60"/><circle cx="47" cy="72" r="2"/></g><text x="216" y="729.7" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#946528">3. Plan missing test</text><text x="216" y="780.9000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">&quot;How do I cure this disease?&quot; must produce an</text><text x="216" y="821.4000000000001" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#183249">out-of-scope response, not a treatment guess.</text><rect x="52" y="869.7" width="1016" height="107" rx="18" fill="#fff3df" stroke="#dfb569"/><text x="76" y="909.7" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#875b22">CHANGE ONE THING</text><text x="76" y="954.8000000000001" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#183249">The corpus gains a teacher-approved flower definition in V2.</text><text x="52" y="1010.7" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#466378">Explain the changed result using the matching lesson.</text></svg>