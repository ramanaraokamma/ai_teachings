<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Accessibility and user feedback: the case</title><desc id="desc">Make feedback accessible. An app marks an incomplete answer with a red circle only; a revision adds equivalent text and keyboard access. Supplied facts: New text: &quot;More explanation needed&quot;. The next-action link is labelled and focusable; status is exposed to assistive technology.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/28 · 01 · LOOK AT THE FACTS</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Accessibility and user feedback: the case</tspan></text><rect x="38" y="161" width="535" height="256" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(61 178) scale(0.72)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="47" cy="24" r="12"/><path d="M47 36 V63 M23 51 L47 40 L71 51 M47 63 L29 83 M47 63 L65 83"/></g><text x="148" y="201" fill="#205fa1" font-size="24" font-weight="750"><tspan x="148" dy="0">The situation</tspan></text><text x="63" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="63" dy="0">Make feedback accessible. An app marks</tspan><tspan x="63" dy="32.66">an incomplete answer with a red circle only;</tspan><tspan x="63" dy="32.66">a revision adds equivalent text and</tspan><tspan x="63" dy="32.66">keyboard access.</tspan></text><rect x="627" y="161" width="535" height="223" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(650 178) scale(0.72)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="737" y="201" fill="#086c68" font-size="24" font-weight="750"><tspan x="737" dy="0">Supplied evidence</tspan></text><text x="652" y="261" fill="#17384c" font-size="23" font-weight="500"><tspan x="652" dy="0">New text: &quot;More explanation needed&quot;. The</tspan><tspan x="652" dy="32.66">next-action link is labelled and focusable;</tspan><tspan x="652" dy="32.66">status is exposed to assistive technology.</tspan></text><rect x="38" y="447" width="1124" height="80" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="480" fill="#086c68" font-size="23" font-weight="650"><tspan x="62" dy="0">Explain accessibility and user feedback using the deciding step in this fictional service.</tspan></text></g></svg>