<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">A deletion rule needs an inventory of copies</title><desc id="desc">The toy retention boundary is seven days or older. Keep six-day T1 for now. Seven-day T2 appears in primary storage and one listed backup; both locations need removal verification. This diagram specifies required checks, not an actual deletion run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="730" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/20 · 03 · CHECK AGE AND EVERY LISTED LOCATION</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">A deletion rule needs an inventory of copies</tspan></text><rect x="38" y="161" width="1124" height="90" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="200" fill="#086c68" font-size="27" font-weight="750"><tspan x="62" dy="0">At least 7 days old → delete all listed copies.</tspan></text><text x="62" y="232" fill="#17384c" font-size="22" font-weight="500"><tspan x="62" dy="0">T1: 6 days → keep for now.     T2: 7 days → deletion boundary reached.</tspan></text><rect x="38" y="285" width="535" height="274" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(248 313) scale(1)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="62" y="454" fill="#205fa1" font-size="28" font-weight="750"><tspan x="62" dy="0">Primary storage</tspan></text><text x="62" y="502" fill="#975014" font-size="24" font-weight="650"><tspan x="62" dy="0">T2: remove, then verify.</tspan></text><rect x="627" y="285" width="535" height="274" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(837 313) scale(1)" fill="none" stroke="#205fa1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="70" height="65" rx="6"/><path d="M12 35 H82 M12 56 H82 M36 14 V79 M59 14 V79"/></g><text x="651" y="454" fill="#205fa1" font-size="28" font-weight="750"><tspan x="651" dy="0">Listed backup</tspan></text><text x="651" y="502" fill="#975014" font-size="24" font-weight="650"><tspan x="651" dy="0">T2: remove, then verify.</tspan></text><text x="62" y="605" fill="#086c68" font-size="28" font-weight="750"><tspan x="62" dy="0">Two declared T2 locations → two removal checks.</tspan></text><text x="62" y="653" fill="#17384c" font-size="23" font-weight="500"><tspan x="62" dy="0">Removing the visible copy alone is incomplete. Unknown copies need investigation.</tspan></text></g></svg>