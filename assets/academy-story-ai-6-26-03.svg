<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Incident investigation — evidence trace</title><desc id="desc">Incident investigation — evidence trace. At 09:00 corpus updates; 09:05 stale cache response; 09:06 cache disabled. Team says model weights changed, but weight version is unchanged. | Record timestamps, versions, requests, authorised actions and outcomes with minimised logs. Separate immediate containment from diagnosis. Compare candidate explanations against evidence. | Weight-change claim is contradicted by the version record. Stale cache is a supported candidate explanation; preserve timeline and test it with controlled reproduction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/26 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Incident investigation — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">At 09:00 corpus updates;</tspan><tspan x="52.0" dy="32.66">09:05 stale cache response;</tspan><tspan x="52.0" dy="32.66">09:06 cache disabled. Team</tspan><tspan x="52.0" dy="32.66">says model weights changed,</tspan><tspan x="52.0" dy="32.66">but weight version is</tspan><tspan x="52.0" dy="32.66">unchanged.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Record timestamps, versions,</tspan><tspan x="426.6666666666667" dy="32.66">requests, authorised actions</tspan><tspan x="426.6666666666667" dy="32.66">and outcomes with minimised</tspan><tspan x="426.6666666666667" dy="32.66">logs. Separate immediate</tspan><tspan x="426.6666666666667" dy="32.66">containment from diagnosis.</tspan><tspan x="426.6666666666667" dy="32.66">Compare candidate</tspan><tspan x="426.6666666666667" dy="32.66">explanations against evidence.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Weight-change claim is</tspan><tspan x="801.3333333333334" dy="32.66">contradicted by the version</tspan><tspan x="801.3333333333334" dy="32.66">record. Stale cache is a</tspan><tspan x="801.3333333333334" dy="32.66">supported candidate</tspan><tspan x="801.3333333333334" dy="32.66">explanation; preserve timeline</tspan><tspan x="801.3333333333334" dy="32.66">and test it with controlled</tspan><tspan x="801.3333333333334" dy="32.66">reproduction.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>