<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="837" viewBox="0 0 1200 837" role="img" aria-labelledby="title desc"><title id="title">Make the idea visible in your project</title><desc id="desc">For the Reproducible AI Research Study, retain an annotated worked trace and the changed-case reasoning. Connect the claim to its records, units and assumptions so another investigator can challenge or reproduce it. Draw your input, deciding step, result and limit. Supported question: Compute the clear and shaded rates and identify alternative explanations. How does the same-object, one-camera follow-up help, and why does changing cameras again reintroduce confounding?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="837" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/36 · 06 · DRAW AND EXPLAIN</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Make the idea visible in your project</tspan></text><rect x="38" y="161" width="1124" height="162.98" rx="20" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="198" fill="#17384c" font-size="23" font-weight="500"><tspan x="62" dy="0">For the Reproducible AI Research Study, retain an annotated worked trace and the changed-case</tspan><tspan x="62" dy="32.66">reasoning. Connect the claim to its records, units and assumptions so another investigator can</tspan><tspan x="62" dy="32.66">challenge or reproduce it.</tspan></text><rect x="38" y="363.98" width="336" height="245" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(158 381.98) scale(0.65)" fill="none" stroke="#086c68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y