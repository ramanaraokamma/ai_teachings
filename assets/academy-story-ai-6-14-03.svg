<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="622" viewBox="0 0 1200 622" role="img" aria-labelledby="title desc"><title id="title">Planning and action selection — evidence trace</title><desc id="desc">Planning and action selection — evidence trace. Generated plan retrieves a room, books it and then answers. It calls booking necessary for helpfulness. | For read-only reporting, allowed plan is validate -&gt; retrieve -&gt; verify -&gt; answer. If retrieval lacks evidence, route to review. Reject write or send steps before they run. | Booking is outside the task boundary. Execute only permitted reporting steps, with a fallback if evidence is insufficient.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="622" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/14 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Planning and action selection — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Generated plan retrieves a</tspan><tspan x="52.0" dy="32.66">room, books it and then</tspan><tspan x="52.0" dy="32.66">answers. It calls booking</tspan><tspan x="52.0" dy="32.66">necessary for helpfulness.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">For read-only reporting,</tspan><tspan x="426.6666666666667" dy="32.66">allowed plan is validate -&gt;</tspan><tspan x="426.6666666666667" dy="32.66">retrieve -&gt; verify -&gt; answer. If</tspan><tspan x="426.6666666666667" dy="32.66">retrieval lacks evidence, route</tspan><tspan x="426.6666666666667" dy="32.66">to review. Reject write or send</tspan><tspan x="426.6666666666667" dy="32.66">steps before they run.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Booking is outside the task</tspan><tspan x="801.3333333333334" dy="32.66">boundary. Execute only</tspan><tspan x="801.3333333333334" dy="32.66">permitted reporting steps, with</tspan><tspan x="801.3333333333334" dy="32.66">a fallback if evidence is</tspan><tspan x="801.3333333333334" dy="32.66">insufficient.</tspan></text><text x="50" y="494" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>