<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="688" viewBox="0 0 1200 688" role="img" aria-labelledby="title desc"><title id="title">Documentation and operational readiness — evidence trace</title><desc id="desc">Documentation and operational readiness — evidence trace. Runbook says start server, but omits data version and recovery steps. Another operator cannot reproduce a result. | A runbook names versions, required non-secret configuration, secret key names, health checks, release/rollback dependencies, alerts and owners. Test it with a fresh operator and fictional fixtures. | Add exact configuration/version references, fixture setup, verification and recovery. Do not publish secret values to make setup easier.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="688" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/32 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Documentation and operational readiness — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Runbook says start server, but</tspan><tspan x="52.0" dy="32.66">omits data version and</tspan><tspan x="52.0" dy="32.66">recovery steps. Another</tspan><tspan x="52.0" dy="32.66">operator cannot reproduce a</tspan><tspan x="52.0" dy="32.66">result.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">A runbook names versions,</tspan><tspan x="426.6666666666667" dy="32.66">required non-secret</tspan><tspan x="426.6666666666667" dy="32.66">configuration, secret key</tspan><tspan x="426.6666666666667" dy="32.66">names, health checks,</tspan><tspan x="426.6666666666667" dy="32.66">release/rollback dependencies,</tspan><tspan x="426.6666666666667" dy="32.66">alerts and owners. Test it with</tspan><tspan x="426.6666666666667" dy="32.66">a fresh operator and fictional</tspan><tspan x="426.6666666666667" dy="32.66">fixtures.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="292" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Add exact</tspan><tspan x="801.3333333333334" dy="32.66">configuration/version</tspan><tspan x="801.3333333333334" dy="32.66">references, fixture setup,</tspan><tspan x="801.3333333333334" dy="32.66">verification and recovery. Do</tspan><tspan x="801.3333333333334" dy="32.66">not publish secret values to</tspan><tspan x="801.3333333333334" dy="32.66">make setup easier.</tspan></text><text x="50" y="560" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>