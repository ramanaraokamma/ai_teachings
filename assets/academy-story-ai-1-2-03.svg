<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="659" viewBox="0 0 1200 659" role="img" aria-labelledby="title desc"><title id="title">Different pencil colours. The same total.</title><desc id="desc">Box A: 2 red pencils and 4 blue, total 6. Box B: 5 red pencils and 1 blue, total 6. The equal totals do not preserve the colour counts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="659" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-1/2 · 03 · COUNT WHAT THE SUMMARY LOSES</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Different pencil colours. The same total.</tspan></text><rect x="38" y="161" width="1124" height="165" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="62" y="205" fill="#17384c" font-size="27" font-weight="750"><tspan x="62" dy="0">Box A</tspan></text><rect x="260" y="192" width="22" height="96" rx="5" fill="#a43135"/><path d="M260 288l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="351" y="192" width="22" height="96" rx="5" fill="#a43135"/><path d="M351 288l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="442" y="192" width="22" height="96" rx="5" fill="#205fa1"/><path d="M442 288l11 21 11-21" fill="#e5caa5" stroke="#205fa1" stroke-width="2"/><rect x="533" y="192" width="22" height="96" rx="5" fill="#205fa1"/><path d="M533 288l11 21 11-21" fill="#e5caa5" stroke="#205fa1" stroke-width="2"/><rect x="624" y="192" width="22" height="96" rx="5" fill="#205fa1"/><path d="M624 288l11 21 11-21" fill="#e5caa5" stroke="#205fa1" stroke-width="2"/><rect x="715" y="192" width="22" height="96" rx="5" fill="#205fa1"/><path d="M715 288l11 21 11-21" fill="#e5caa5" stroke="#205fa1" stroke-width="2"/><text x="861" y="216" fill="#086c68" font-size="31" font-weight="750"><tspan x="861" dy="0">Total = 6</tspan></text><text x="861" y="258" fill="#17384c" font-size="22" font-weight="500"><tspan x="861" dy="0">Red 2 · Blue 4</tspan></text><rect x="38" y="351" width="1124" height="165" rx="20" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="62" y="395" fill="#17384c" font-size="27" font-weight="750"><tspan x="62" dy="0">Box B</tspan></text><rect x="260" y="382" width="22" height="96" rx="5" fill="#a43135"/><path d="M260 478l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="351" y="382" width="22" height="96" rx="5" fill="#a43135"/><path d="M351 478l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="442" y="382" width="22" height="96" rx="5" fill="#a43135"/><path d="M442 478l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="533" y="382" width="22" height="96" rx="5" fill="#a43135"/><path d="M533 478l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="624" y="382" width="22" height="96" rx="5" fill="#a43135"/><path d="M624 478l11 21 11-21" fill="#e5caa5" stroke="#a43135" stroke-width="2"/><rect x="715" y="382" width="22" height="96" rx="5" fill="#205fa1"/><path d="M715 478l11 21 11-21" fill="#e5caa5" stroke="#205fa1" stroke-width="2"/><text x="861" y="406" fill="#086c68" font-size="31" font-weight="750"><tspan x="861" dy="0">Total = 6</tspan></text><text x="861" y="448" fill="#17384c" font-size="22" font-weight="500"><tspan x="861" dy="0">Red 5 · Blue 1</tspan></text><text x="62" y="569" fill="#086c68" font-size="26" font-weight="750"><tspan x="62" dy="0">Saving only “6” hides which box has more red pencils.</tspan></text></g></svg>