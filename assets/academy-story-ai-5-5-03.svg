roke-width="2"/><text x="801.3333333333334" y="402" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">y is 3</tspan></text><text x="50" y="471" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Read the rows from top to bottom. The first two rows together form the hidden layer; the final row is the</tspan><tspan x="50" dy="31.24">output layer. Each row shows the values actually passed to the next stage.</tspan></text></g></svg>