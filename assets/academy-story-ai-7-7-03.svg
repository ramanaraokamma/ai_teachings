<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Hypotheses and measurable outcomes — evidence trace</title><desc id="desc">Hypotheses and measurable outcomes — evidence trace. After seeing faster responses, the team changes its primary claim from support improvement to speed improvement. | Toy hypothesis:method B improves supported-answer rate over baseline A on a reserved paired set. Define support rubric and failure treatment; record secondary outcomes separately. | Report the change as exploratory/post-result revision. Preserve the original support hypothesis; do not present speed as the prespecified primary outcome.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-7/7 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Hypotheses and measurable outcomes — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">After seeing faster responses,</tspan><tspan x="52.0" dy="32.66">the team changes its primary</tspan><tspan x="52.0" dy="32.66">claim from support</tspan><tspan x="52.0" dy="32.66">improvement to speed</tspan><tspan x="52.0" dy="32.66">improvement.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Toy hypothesis:method B</tspan><tspan x="426.6666666666667" dy="32.66">improves supported-answer</tspan><tspan x="426.6666666666667" dy="32.66">rate over baseline A on a</tspan><tspan x="426.6666666666667" dy="32.66">reserved paired set. Define</tspan><tspan x="426.6666666666667" dy="32.66">support rubric and failure</tspan><tspan x="426.6666666666667" dy="32.66">treatment; record secondary</tspan><tspan x="426.6666666666667" dy="32.66">outcomes separately.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Report the change as</tspan><tspan x="801.3333333333334" dy="32.66">exploratory/post-result</tspan><tspan x="801.3333333333334" dy="32.66">revision. Preserve the original</tspan><tspan x="801.3333333333334" dy="32.66">support hypothesis; do not</tspan><tspan x="801.3333333333334" dy="32.66">present speed as the</tspan><tspan x="801.3333333333334" dy="32.66">prespecified primary outcome.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>