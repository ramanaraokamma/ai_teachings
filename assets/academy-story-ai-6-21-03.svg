<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Caching and stale information — evidence trace</title><desc id="desc">Caching and stale information — evidence trace. Teacher response is cached by query only and returned to a student. | Cache key includes query, role, corpus version and procedure version. Entry valid only while age&lt;TTL. At exact TTL it expires. Teacher and student results never share a role-agnostic key. | Role omission creates an access leak. Include role and enforce current permission before returning any cached content.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="655" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-6/21 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Caching and stale information — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">Teacher response is cached</tspan><tspan x="52.0" dy="32.66">by query only and returned to</tspan><tspan x="52.0" dy="32.66">a student.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Cache key includes query,</tspan><tspan x="426.6666666666667" dy="32.66">role, corpus version and</tspan><tspan x="426.6666666666667" dy="32.66">procedure version. Entry valid</tspan><tspan x="426.6666666666667" dy="32.66">only while age&lt;TTL. At exact</tspan><tspan x="426.6666666666667" dy="32.66">TTL it expires. Teacher and</tspan><tspan x="426.6666666666667" dy="32.66">student results never share a</tspan><tspan x="426.6666666666667" dy="32.66">role-agnostic key.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="259" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">Role omission creates an</tspan><tspan x="801.3333333333334" dy="32.66">access leak. Include role and</tspan><tspan x="801.3333333333334" dy="32.66">enforce current permission</tspan><tspan x="801.3333333333334" dy="32.66">before returning any cached</tspan><tspan x="801.3333333333334" dy="32.66">content.</tspan></text><text x="50" y="527" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>