<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="852" viewBox="0 0 1200 852" role="img" aria-labelledby="title desc"><title id="title">Four-step worked evidence for Week 14: Scores and Calibration Intuition</title><desc id="desc">Four-step worked evidence for Week 14: Scores and Calibration Intuition. 1 | Each score estimates the probability that the selected label is correct. Ten predictions have such scores near 0.8.. 2 | Only six are correct, so observed correctness is 6 ÷ 10 = 60%.. 3 | The score ranking may still help, but 0.8 should not be stated as an 80% guarantee.. 4 | Use bins across many cases and design an uncertain zone requiring human review.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="852" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-4/14 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Four-step worked evidence for Week 14: Scores and Calibration</tspan><tspan x="38" dy="48.28">Intuition</tspan></text><rect x="38.0" y="209" width="556.0" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="240" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Step</tspan></text><rect x="600.0" y="209" width="556.0" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="614.0" y="240" fill="#086c68" font-size="21" font-weight="750"><tspan x="614.0" dy="0">Evidence and reasoning</tspan></text><rect x="38.0" y="277" width="556.0" height="127" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="308" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">1</tspan></text><rect x="600.0" y="277" width="556.0" height="127" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="308" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Each score estimates the probability that the</tspan><tspan x="614.0" dy="32.66">selected label is correct. Ten predictions have</tspan><tspan x="614.0" dy="32.66">such scores near 0.8.</tspan></text><rect x="38.0" y="414" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="445" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">2</tspan></text><rect x="600.0" y="414" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="445" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Only six are correct, so observed correctness is</tspan><tspan x="614.0" dy="32.66">6 ÷ 10 = 60%.</tspan></text><rect x="38.0" y="518" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="549" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">3</tspan></text><rect x="600.0" y="518" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="549" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">The score ranking may still help, but 0.8 should</tspan><tspan x="614.0" dy="32.66">not be stated as an 80% guarantee.</tspan></text><rect x="38.0" y="622" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="653" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">4</tspan></text><rect x="600.0" y="622" width="556.0" height="94" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="614.0" y="653" fill="#17384c" font-size="23" font-weight="500"><tspan x="614.0" dy="0">Use bins across many cases and design an</tspan><tspan x="614.0" dy="32.66">uncertain zone requiring human review.</tspan></text><text x="50" y="755" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">Trace these corrected steps. Keep the stated metric, assumptions and interpretation when you change</tspan><tspan x="50" dy="31.24">the case.</tspan></text></g></svg>