<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="622" viewBox="0 0 1200 622" role="img" aria-labelledby="title desc"><title id="title">Image generation and provenance — evidence trace</title><desc id="desc">Image generation and provenance — evidence trace. A fictional poster requires exactly three labelled circles. Generated image shows four circles and one unreadable label. A caption calls it a photograph of a real lesson. | Keep a provenance record containing specification, tool/version when known, generation date, edits, permissions and intended use. | It fails count and label criteria; the photograph claim is unsupported. Record it as a generated fictional illustration and revise or reject before use.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="622" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY / AI-3/11 · 03 · INSPECT THE LESSON MODEL</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Image generation and provenance — evidence trace</tspan></text><rect x="38.0" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="52.0" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="52.0" dy="0">Input and scope</tspan></text><rect x="412.6666666666667" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="426.6666666666667" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="426.6666666666667" dy="0">Check or calculation</tspan></text><rect x="787.3333333333334" y="161" width="368.6666666666667" height="58" rx="10" fill="#e2f1ed" stroke="#bed5cf" stroke-width="2"/><text x="801.3333333333334" y="192" fill="#086c68" font-size="21" font-weight="750"><tspan x="801.3333333333334" dy="0">Conclusion and limit</tspan></text><rect x="38.0" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="52.0" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="52.0" dy="0">A fictional poster requires</tspan><tspan x="52.0" dy="32.66">exactly three labelled circles.</tspan><tspan x="52.0" dy="32.66">Generated image shows four</tspan><tspan x="52.0" dy="32.66">circles and one unreadable</tspan><tspan x="52.0" dy="32.66">label. A caption calls it a</tspan><tspan x="52.0" dy="32.66">photograph of a real lesson.</tspan></text><rect x="412.6666666666667" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="426.6666666666667" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="426.6666666666667" dy="0">Keep a provenance record</tspan><tspan x="426.6666666666667" dy="32.66">containing specification,</tspan><tspan x="426.6666666666667" dy="32.66">tool/version when known,</tspan><tspan x="426.6666666666667" dy="32.66">generation date, edits,</tspan><tspan x="426.6666666666667" dy="32.66">permissions and intended use.</tspan></text><rect x="787.3333333333334" y="229" width="368.6666666666667" height="226" rx="10" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="801.3333333333334" y="260" fill="#17384c" font-size="23" font-weight="500"><tspan x="801.3333333333334" dy="0">It fails count and label criteria;</tspan><tspan x="801.3333333333334" dy="32.66">the photograph claim is</tspan><tspan x="801.3333333333334" dy="32.66">unsupported. Record it as a</tspan><tspan x="801.3333333333334" dy="32.66">generated fictional illustration</tspan><tspan x="801.3333333333334" dy="32.66">and revise or reject before use.</tspan></text><text x="50" y="494" fill="#476176" font-size="22" font-weight="500"><tspan x="50" dy="0">The figure connects this chapter&#x27;s worked input, declared procedure and result. Read the complete</tspan><tspan x="50" dy="31.24">worked reasoning for qualifiers and intermediate steps; the abbreviated labels do not replace that</tspan><tspan x="50" dy="31.24">reasoning.</tspan></text></g></svg>