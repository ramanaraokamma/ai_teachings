<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">One bus display. Three different decisions.</title><desc id="desc">Three separate rows trace the bus estimate, display colour and driver override. The fitted model estimates 12 minutes; the written greater-than-10 rule makes the display red; the driver can choose ROUTE CLOSED.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY  /  LEVEL 1 · WEEK 1</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">One bus display. Three different decisions.</tspan></text><rect x="38" y="148" width="1124" height="128" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="56" y="178" fill="#205fa1" font-size="16" font-weight="750"><tspan x="56" dy="0">1  LEARNED ESTIMATE</tspan></text><text x="56" y="227" fill="#17384c" font-size="21" font-weight="500"><tspan x="56" dy="0">Current route + traffic</tspan></text><path d="M332 223 L382 223" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="403" y="227" fill="#17384c" font-size="20" font-weight="500"><tspan x="403" dy="0">Model fitted on past journeys</tspan></text><path d="M765 223 L813 223" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="833" y="227" fill="#17384c" font-size="21" font-weight="750"><tspan x="833" dy="0">Estimated delay: 12 min</tspan></text><rect x="38" y="296" width="1124" height="128" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="56" y="326" fill="#6541a5" font-size="16" font-weight="750"><tspan x="56" dy="0">2  WRITTEN COLOUR RULE</tspan></text><text x="56" y="375" fill="#17384c" font-size="21" font-weight="500"><tspan x="56" dy="0">Estimated delay: 12 min</tspan></text><path d="M332 371 L382 371" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="403" y="375" fill="#17384c" font-size="20" font-weight="500"><tspan x="403" dy="0">Is the delay greater than 10?</tspan></text><path d="M765 371 L813 371" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="833" y="375" fill="#17384c" font-size="21" font-weight="750"><tspan x="833" dy="0">Yes → red display</tspan></text><rect x="38" y="444" width="1124" height="128" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><text x="56" y="474" fill="#086c68" font-size="16" font-weight="750"><tspan x="56" dy="0">3  HUMAN OVERRIDE</tspan></text><text x="56" y="523" fill="#17384c" font-size="21" font-weight="500"><tspan x="56" dy="0">Driver sees closure notice</tspan></text><path d="M332 519 L382 519" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="403" y="523" fill="#17384c" font-size="20" font-weight="500"><tspan x="403" dy="0">Driver chooses a message</tspan></text><path d="M765 519 L813 519" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><text x="833" y="523" fill="#17384c" font-size="21" font-weight="750"><tspan x="833" dy="0">Display: ROUTE CLOSED</tspan></text><text x="60" y="631" fill="#17384c" font-size="23" font-weight="500"><tspan x="60" dy="0">Follow one decision at a time: estimating a number, choosing a colour, replacing a message.</tspan><tspan x="60" dy="32.199999999999996">A correct colour comparison does not prove that the estimated delay is accurate.</tspan></text></g></svg>