<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">“Not enough information” is a useful answer</title><desc id="desc">An unspecified smart robot vacuum moves and cleans, but its route mechanism is unknown. Ask for evidence of human commands, written rules or model fitting, and allow combinations. Apply this reasoning to a classroom sorter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY  /  LEVEL 1 · WEEK 1</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">“Not enough information” is a useful answer</tspan></text><rect x="38" y="139" width="363" height="400" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><g transform="translate(140 211) scale(1.05)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="63" cy="71" rx="56" ry="33" fill="#c9dce9"/><path d="M7 71v12c0 42 112 42 112 0V71" fill="#e5eff5"/><ellipse cx="63" cy="60" rx="19" ry="9" fill="#fff"/><path d="M35 85h20"/></g><text x="65" y="394" fill="#17384c" font-size="25" font-weight="750"><tspan x="65" dy="0">“Smart” robot vacuum</tspan></text><text x="65" y="440" fill="#17384c" font-size="21" font-weight="500"><tspan x="65" dy="0">It moves and cleans.</tspan><tspan x="65" dy="29.4">How does it choose a route?</tspan><tspan x="65" dy="29.4">The description does not say.</tspan></text><path d="M422 337 L472 337" fill="none" stroke="#7892a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="495" y="139" width="667" height="400" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="519" y="160" width="365" height="34" rx="17" fill="#fff" stroke="#086c68" stroke-width="2"/><text x="533" y="184" fill="#086c68" font-size="15" font-weight="750"><tspan x="533" dy="0">ASK FOR MECHANISM EVIDENCE</tspan></text><text x="520" y="244" fill="#17384c" font-size="23" font-weight="500"><tspan x="520" dy="0">Person steering? → evidence of human control</tspan><tspan x="520" dy="32.199999999999996">Explicit route instructions? → evidence of rules</tspan><tspan x="520" dy="32.199999999999996">Model fitted on examples? → evidence of learning</tspan></text><text x="520" y="388" fill="#17384c" font-size="25" font-weight="650"><tspan x="520" dy="0">Several may be combined.</tspan><tspan x="520" dy="35.0">If evidence is missing, say:</tspan><tspan x="520" dy="35.0">“I need more information.”</tspan></text><rect x="38" y="568" width="1124" height="116" rx="22" fill="#fff3df" stroke="#e8c995" stroke-width="2"/><text x="62" y="607" fill="#17384c" font-size="21" font-weight="500"><tspan x="62" dy="0">PROJECT: Draw input → deciding step → output for your classroom sorter.</tspan><tspan x="62" dy="29.4">Label each deciding step: human / written rule / learned model / not yet known.</tspan><tspan x="62" dy="29.4">Then name the evidence for your label.</tspan></text></g></svg>