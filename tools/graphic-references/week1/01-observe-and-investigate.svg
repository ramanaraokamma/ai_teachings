<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Seeing a result is not explaining it</title><desc id="desc">A bus has a red display showing a 12-minute delay. That is an observation. A supplied engineering note says past journeys fitted the delay model; that is evidence about its mechanism.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7892a4"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f4f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" fill="#086c68" font-size="15" font-weight="750"><tspan x="38" dy="0">AI ACADEMY  /  LEVEL 1 · WEEK 1</tspan></text><text x="38" y="94" fill="#17384c" font-size="34" font-weight="750"><tspan x="38" dy="0">Seeing a result is not explaining it</tspan></text><rect x="38" y="130" width="535" height="440" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="627" y="130" width="535" height="440" rx="22" fill="#fff" stroke="#cbdce5" stroke-width="2"/><rect x="62" y="152" width="165" height="34" rx="17" fill="#fff" stroke="#205fa1" stroke-width="2"/><text x="76" y="176" fill="#205fa1" font-size="15" font-weight="750"><tspan x="76" dy="0">1  OBSERVE</tspan></text><rect x="651" y="152" width="192" height="34" rx="17" fill="#fff" stroke="#086c68" stroke-width="2"/><text x="665" y="176" fill="#086c68" font-size="15" font-weight="750"><tspan x="665" dy="0">2  INVESTIGATE</tspan></text><g transform="translate(72 223) scale(1.4)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="18" width="128" height="65" rx="13" fill="#f4c55c"/><path d="M14 34h100v26H14z" fill="#d8eff7"/><path d="M46 34v26m34-26v26"/><circle cx="30" cy="84" r="12" fill="#17384c"/><circle cx="106" cy="84" r="12" fill="#17384c"/></g><rect x="292" y="241" width="250" height="112" rx="12" fill="#17384c" stroke="#17384c" stroke-width="2"/><text x="310" y="280" fill="#ffb0b0" font-size="23" font-weight="750"><tspan x="310" dy="0">DELAY 12 MIN</tspan></text><text x="310" y="316" fill="#fff" font-size="20" font-weight="650"><tspan x="310" dy="0">RED DISPLAY</tspan></text><text x="62" y="420" fill="#17384c" font-size="26" font-weight="500"><tspan x="62" dy="0">“The display is red.”</tspan><tspan x="62" dy="36.4">“It shows a 12-minute delay.”</tspan></text><text x="62" y="516" fill="#476176" font-size="20" font-weight="500"><tspan x="62" dy="0">These describe what we can see.</tspan></text><g transform="translate(653 228) scale(1)" fill="none" stroke="#17384c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="105" height="110" rx="10" fill="#e3effa"/><path d="M30 30h60m-60 25h60m-60 25h60m-42-50v65m23-65v65"/></g><text x="803" y="250" fill="#086c68" font-size="19" font-weight="750"><tspan x="803" dy="0">ENGINEERING NOTE</tspan></text><text x="803" y="290" fill="#17384c" font-size="23" font-weight="500"><tspan x="803" dy="0">Past journeys fitted</tspan><tspan x="803" dy="32.199999999999996">the delay model.</tspan></text><text x="651" y="420" fill="#17384c" font-size="26" font-weight="500"><tspan x="651" dy="0">“The estimator uses a model</tspan><tspan x="651" dy="36.4">learned from examples.”</tspan></text><text x="651" y="516" fill="#476176" font-size="20" font-weight="500"><tspan x="651" dy="0">This claim needs process evidence.</tspan></text><rect x="38" y="594" width="1124" height="88" rx="22" fill="#e2f1ed" stroke="#b5d8ce" stroke-width="2"/><text x="62" y="631" fill="#17384c" font-size="22" font-weight="500"><tspan x="62" dy="0">A red number tells us the colour — not how the number was produced.</tspan><tspan x="62" dy="30.799999999999997">Ask: “What evidence shows how this decision was made?”</tspan></text></g></svg>